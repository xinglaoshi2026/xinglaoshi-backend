<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>邢老师工作台·手机端</title>
<style>
  /* ===== 与桌面版一致的配色与组件体系 ===== */
  :root{
    --primary:#4F46E5; --primary-light:#818CF8; --primary-dark:#3730A3; --primary-bg:#EEF2FF;
    --bg:#F3F4F6; --card-bg:#FFFFFF; --text:#1F2937; --text-muted:#6B7280;
    --border:#E5E7EB; --border-dark:#D1D5DB;
    --success:#10B981; --success-bg:#ECFDF5; --warning:#F59E0B; --warning-bg:#FFFBEB;
    --danger:#EF4444; --danger-bg:#FEF2F2; --info:#3B82F6; --info-bg:#EFF6FF;
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06); --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 30px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
    --tabbar-h:56px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--primary);text-decoration:none}
  .hidden{display:none!important}
  .muted{color:var(--text-muted);font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .center{text-align:center;padding:40px 10px;color:var(--text-muted)}

  /* ===== 内容区（底部留出 tabbar 空间） ===== */
  .content{flex:1;padding:12px 12px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);max-width:1100px;width:100%;margin:0 auto}
  .main-view{}

  /* ===== 卡片 ===== */
  .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);
    overflow:hidden;padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--text)}
  .card.page{padding:0;overflow:visible}

  /* ===== 标签/徽章 ===== */
  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;
    background:var(--primary-bg);color:var(--primary);margin-right:5px}
  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
  .badge-success{background:var(--success-bg);color:var(--success)}
  .badge-warning{background:var(--warning-bg);color:var(--warning)}
  .badge-danger{background:var(--danger-bg);color:var(--danger)}
  .badge-info{background:var(--info-bg);color:var(--info)}
  .badge-gray{background:#F3F4F6;color:var(--text-muted)}

  /* ===== 按钮 ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
    border-radius:var(--radius-sm);font-size:14px;font-weight:500;background:var(--primary);color:#fff;transition:all .15s;white-space:nowrap}
  .btn:active{opacity:.85}
  .btn.sec{background:#fff;color:var(--text);border:1px solid var(--border-dark)}
  .btn.sec:active{background:var(--bg);border-color:var(--primary);color:var(--primary)}
  .btn.ok{background:var(--success);color:#fff}
  .btn.danger{background:var(--danger-bg);color:var(--danger)}
  .btn.danger:active{background:var(--danger);color:#fff}
  .btn.sm{padding:6px 11px;font-size:13px}
  /* 简约文字风按钮：列表卡操作、错题操作、组卷顶部、搜索行 */
  .pa-actions .btn,.wn-card .row .btn,.compose-actions .btn,.search .btn{background:none;border:none;padding:6px 4px;font-weight:600;box-shadow:none}
  .pa-actions .btn{color:var(--primary)}
  .pa-actions .btn.ok{color:var(--success)}
  .wn-card .row .btn.ok{color:var(--success)}
  .wn-card .row .btn.sec{color:var(--text-muted)}
  .wn-card .row .btn.danger{color:var(--danger)}
  .compose-actions .btn{color:var(--primary)}
  .compose-actions .btn.sec{color:var(--text)}
  .search .btn{color:var(--primary);flex-shrink:0}
  .btn:disabled{opacity:.5}

  /* ===== 表单 ===== */
  label.kv{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin:10px 0 6px}
  input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border-dark);border-radius:var(--radius-sm);
    background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
  textarea{min-height:84px;resize:vertical;line-height:1.6}
  .search{display:flex;gap:8px;margin-bottom:10px}
  .search input{flex:1}
  .seg{display:flex;gap:6px;margin:8px 0}
  .seg button{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;font-size:14px}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* ===== 题目卡片 ===== */
  .card.q{border-left:none;border-radius:0;box-shadow:none;margin:0 -12px 10px;padding:6px 0}
  .q-content{font-size:14px;line-height:1.7;margin:8px 10px;white-space:pre-wrap;word-break:break-word}
  .q-answer{font-size:13px;color:var(--text-muted);background:#F9FAFB;padding:10px 14px;border-radius:var(--radius-sm);
    margin-top:8px;white-space:pre-wrap;border:1px dashed var(--border)}
  .q-head{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;padding:12px 14px 2px}
  .q-head .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-kp-line{padding:2px 14px 0}
  .q-kp{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--primary);
    background:var(--primary-bg);padding:2px 9px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-kp:active{background:#E0E7FF}
  .q-body-wrap{padding:4px 14px 0;cursor:pointer}
  .q-ans-box{margin:8px 14px 0;display:none;border-left:3px solid var(--info);background:var(--info-bg);
    border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .q-ans-box.open{display:block;animation:fadeIn .18s ease}
  .q-ans-box .ans-label{font-weight:600;color:var(--info);margin-bottom:4px}
  /* 题卡操作行：无边框纯文字链接，简约小巧，给题目内容腾空间 */
  .q-actions{display:flex;align-items:center;gap:4px;margin-top:4px;padding:4px 14px 2px}
  .q-link{background:none;border:none;box-shadow:none;padding:4px 6px;font-size:11px;line-height:1;
    color:#7A7F8A;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .q-link:active{color:var(--primary)}
  .q-link.on{color:var(--primary);font-weight:600}
  .q-link.danger.on{color:var(--danger)}

  /* ===== 筛选栏（下拉菜单形式） ===== */
  .filter-bar{background:var(--bg);padding:2px 0 6px}
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;margin-bottom:8px}
  .filter-row select{flex:1 1 0;width:auto;min-width:0;padding:9px 8px;
    appearance:none;-webkit-appearance:none;
    background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>") no-repeat right 10px center;
    font-size:13px;font-weight:500;color:var(--text);border:1px solid var(--border-dark);border-radius:var(--radius-sm)}
  .filter-row select.on{border-color:var(--primary);color:var(--primary);background-color:var(--primary-bg)}
  .filter-row .filter-select{flex:1.2 1 0;text-align:left;padding:9px 26px 9px 10px;
    appearance:none;-webkit-appearance:none;font-size:13px;font-weight:500;color:var(--text-muted);
    border:1px solid var(--border-dark);border-radius:var(--radius-sm);background:#fff
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B7280'/></svg>") no-repeat right 10px center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter-row .filter-select.on{border-color:var(--primary);color:var(--primary);background-color:var(--primary-bg)}
  .filter-row .f-search{flex:1.6 1 0;min-width:0}
  .q-count{font-size:12px;color:var(--text-muted);margin:4px 2px 8px;display:flex;align-items:center;gap:6px}

  /* ===== 知识点选择底部抽屉 ===== */
  .sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:flex-end;animation:fadeIn .15s}
  .sheet{background:#fff;width:100%;max-height:80vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
    box-shadow:var(--shadow-lg);animation:sheetUp .22s ease}
  @keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .sheet-title{font-size:16px;font-weight:600}
  .sheet-body{overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));flex:1}
  .kp-row{display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--radius-sm);font-size:14px}
  .kp-row:active{background:var(--primary-bg)}
  .kp-toggle{width:26px;height:26px;flex-shrink:0;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:12px;transition:transform .15s}
  .kp-toggle.open{transform:rotate(90deg)}
  .kp-toggle.leaf{visibility:hidden}
  .kp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kp-row.sel .kp-name{color:var(--primary);font-weight:600}
  .kp-cnt{font-size:12px;color:var(--text-muted);flex-shrink:0}
  .kp-kids{margin-left:16px;border-left:1px dashed var(--border-dark);padding-left:4px;display:none}
  .kp-kids.open{display:block}

  /* ===== 图片灯箱 ===== */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;align-items:center;justify-content:center;
    padding:16px;animation:fadeIn .15s}
  .lightbox img{max-width:100%;max-height:92vh;border-radius:8px;object-fit:contain}

  /* ===== 错题本 ===== */
  .wn-card{border-left:4px solid var(--danger)}
  .wn-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .wn-note{font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:6px;padding:4px 8px;margin-top:6px}

  /* ===== 课时统计（无边框） ===== */
  .rec-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .rec-stat{background:var(--bg,#f6f7f9);border-radius:12px;padding:10px 12px}
  .rec-stat .l{font-size:12px;color:var(--text-sec,#666)}
  .rec-stat .v{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0}
  .rec-stat .s{font-size:11px;color:var(--text-sec,#666)}
  .rec-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:10px}
  .rec-table{border-collapse:collapse;min-width:100%;font-size:12px;text-align:center}
  .rec-table th,.rec-table td{border:1px solid #e5e7eb;padding:5px 8px;white-space:nowrap}
  .rec-table .rt-grade th{font-weight:700;color:#333}
  .rec-table .rt-stu th{font-weight:600;background:#fafafa}
  .rec-table .rt-count td{color:var(--text-sec,#666)}
  .rec-table .rt-date{color:var(--text-sec,#666)}

  /* ===== 图片兜底 ===== */
  .qimg{max-width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);margin:6px 0;display:block}
  .q-content img,.q-ans-box img,.q-preview-card img,.modal img,.wn-card img{
    max-width:100%!important;height:auto!important;width:auto!important}
  /* 题目图片放大：居中且等比例放大铺满并超出屏宽，容器裁切两侧实现居中放大 */
  .card.q .q-content{overflow:hidden}
  .card.q .q-content img{width:135%!important;height:auto!important;display:block;margin:6px auto!important}
  .q-ans-box img{width:100%!important;height:auto!important;display:block;margin:6px auto!important}

  /* ===== 底部四主菜单 tabbar ===== */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:42;height:var(--tabbar-h);
    display:flex;background:#fff;border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--text-muted);font-size:11px;font-weight:500;transition:color .15s}
  .tab-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .tab-btn.active{color:var(--primary);font-weight:600}

  /* ===== 主视图内的 sub-tab 条（顶部平铺） ===== */
  .subtabs{position:sticky;top:0;z-index:25;display:flex;gap:26px;overflow-x:auto;padding:10px 4px 8px;
    background:var(--bg);-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtab{flex-shrink:0;position:relative;padding:4px 2px;border:none;background:none;
    font-size:14px;font-weight:600;color:var(--text-muted);transition:color .15s}
  .subtab:active{opacity:.7}
  .subtab.on{color:var(--primary)}
  .subtab.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-3px;
    width:18px;height:3px;border-radius:2px;background:var(--primary)}
  .subpane{}

  /* ===== 组卷底部浮条 ===== */
  .compose-bar{position:fixed;left:0;right:0;bottom:var(--tabbar-h);z-index:41;
    display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;
    border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .compose-bar .btn{flex:1}
  .compose-bar .btn.ok{background:var(--primary)}

  /* ===== 试卷/组卷卡片 ===== */
  .pa-card{display:flex;align-items:center;gap:10px}
  .pa-card .pa-main{flex:1;min-width:0}
  .pa-card .pa-title{font-size:15px;font-weight:600}
  .pa-card .pa-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
  .pa-card .pa-actions{display:flex;gap:6px;flex-shrink:0}

  /* ===== 周课表网格（复刻电脑版） ===== */
  .week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .week-range{display:flex;flex-direction:column;align-items:center;flex:1;min-width:120px}
  .wr-title{font-size:13px;font-weight:600}
  .wr-sub{font-size:12px;color:var(--text-muted)}
  .schedule-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .schedule-table{display:grid;grid-template-columns:54px repeat(7,minmax(76px,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-width:600px}
  .schedule-table>div{background:var(--card-bg);padding:5px 4px;text-align:center;display:flex;
    align-items:center;justify-content:center;min-height:46px;font-size:12px;line-height:1.25}
  .st-corner,.st-time{background:var(--primary-bg)!important;color:var(--primary);font-weight:600}
  .st-day{background:var(--primary)!important;color:#fff;font-weight:600;flex-direction:column;gap:1px}
  .st-day .sd-date{font-size:10px;opacity:.85;font-weight:400}
  .st-cell.empty{color:var(--text-muted);background:#FBFBFD}
  .st-cell.has-class{background:var(--primary-bg);cursor:pointer;flex-direction:column;gap:2px;padding:4px 3px}
  .st-names{display:flex;flex-direction:column;gap:2px;width:100%}
  .st-name-wrap{display:flex;align-items:center;justify-content:center;gap:3px;background:#fff;border-radius:6px;padding:3px 2px;
    box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .st-name{font-size:12px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-del{color:var(--danger);font-weight:700;font-size:13px;padding:0 2px}

  /* ===== 学生卡片 ===== */
  .stu-card{display:flex;align-items:center;gap:10px}
  .stu-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
  .stu-main{flex:1;min-width:0}
  .stu-name{font-size:15px;font-weight:600}
  .stu-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
  .stu-hours{text-align:right;flex-shrink:0}
  .stu-hours .h{font-size:18px;font-weight:700;color:var(--primary)}
  .stu-hours .l{font-size:11px;color:var(--text-muted)}

  /* ===== 设置 ===== */
  .set-group{margin-bottom:14px}
  .set-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow-sm);margin-bottom:8px;font-size:14px}
  .set-item .si-ico{font-size:18px}
  .set-item .si-main{flex:1}
  .set-item .si-sub{font-size:12px;color:var(--text-muted)}

  /* ===== 弹窗 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;
    z-index:60;padding:24px 14px;overflow-y:auto;animation:fadeIn .15s ease}
  .modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto;
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .2s ease}
  .modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .modal-title{font-size:17px;font-weight:700}
  .modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted)}
  .modal-close:active{background:var(--bg)}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .modal-footer{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;flex-shrink:0;background:#fff}
  .modal-footer .row-2,.modal-footer .row-3{display:flex;gap:10px}
  .modal-footer .row-2 .btn,.modal-footer .row-3 .btn{flex:1;margin:0}

  .q-preview-card{border:1px solid var(--border);background:var(--bg);border-radius:var(--radius-sm);
    padding:12px 14px;max-height:32vh;overflow-y:auto;margin-bottom:16px}
  .form-group{margin-bottom:12px}
  .kv .opt{font-weight:400;color:var(--text-muted);font-size:12px}

  .dt-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .dt-label{display:inline-block;font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-bg);
    padding:3px 12px;border-radius:999px;margin-bottom:8px}
  .dt-label.ans{color:var(--info);background:var(--info-bg)}
  .dt-content{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .dt-content.ans-box{background:var(--info-bg);border-left:3px solid var(--info);padding:10px 14px;border-radius:var(--radius-sm)}

  /* ===== 登录 ===== */
  .auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);padding:16px}
  .auth-card{width:360px;max-width:92vw;background:var(--card-bg);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:28px 26px}
  .auth-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--primary);margin-bottom:20px}
  .auth-logo{font-size:24px}
  .auth-title{font-size:16px;font-weight:600;margin-bottom:14px}
  .auth-hint{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6}

  /* ===== Toast ===== */
  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);background:var(--text);color:#fff;
    padding:9px 16px;border-radius:var(--radius-sm);z-index:80;opacity:0;transition:.2s;font-size:14px;box-shadow:var(--shadow-lg);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 登录 -->
  <div id="loginView" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand"><span class="auth-logo">📘</span>邢老师工作台</div>
      <div class="auth-title">手机端登录</div>
      <label class="kv">后端地址（部署后自动填充，默认同源）</label>
      <input id="baseUrl" placeholder="https://your-app.up.railway.app" value="">
      <label class="kv">用户名</label>
      <input id="username" placeholder="admin" value="admin">
      <label class="kv">密码</label>
      <input id="password" type="password" placeholder="密码" value="">
      <div style="height:10px"></div>
      <button class="btn" style="width:100%" onclick="doLogin()">登录</button>
      <p class="auth-hint" id="loginMsg">登录云端同步账号，即可在手机上查看 / 添加 / 修改题库、试卷、学生等。</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView" class="hidden">
    <main class="content" id="body">

      <!-- 题库主视图 -->
      <section id="view-questions" class="main-view">
        <div class="subtabs" id="qSubTabs">
          <button class="subtab on" data-sub="q" onclick="qSub('q')">题库</button>
          <button class="subtab" data-sub="compose" onclick="qSub('compose')">组卷</button>
          <button class="subtab" data-sub="paper" onclick="qSub('paper')">试卷</button>
          <button class="subtab" data-sub="wrong" onclick="qSub('wrong')">错题</button>
          <button class="subtab" data-sub="add" onclick="qSub('add')">添加题目</button>
        </div>

        <div id="sub-q" class="subpane">
          <div class="filter-row">
            <select id="qTypeSel" onchange="setTypeFilter(this.value)">
              <option value="">全部题型</option>
            </select>
            <button id="qKpBtn" type="button" class="filter-select" onclick="openKpSheet()">全部知识点</button>
            <input id="qSearch" class="f-search" placeholder="搜索题干/答案/编号…" oninput="debounce(applyFilter,400)()">
          </div>
          <div class="q-count" id="qCount"></div>
          <div id="qList"></div>
          <div class="center"><button class="btn sec" onclick="loadMore()">加载更多</button></div>
        </div>

        <div id="sub-compose" class="subpane hidden">
          <div class="row compose-actions" style="margin-bottom:10px">
            <button class="btn" style="flex:1" onclick="openComposeModal()">＋ 新建组卷</button>
            <button class="btn sec" style="flex:1" onclick="openWrongPaperBuilder()">📕 错题重组卷</button>
          </div>
          <div id="myPapers"></div>
        </div>

        <div id="sub-paper" class="subpane hidden">
          <div id="allPapers"></div>
        </div>

        <div id="sub-wrong" class="subpane hidden">
          <div class="search">
            <input id="wrongSearch" placeholder="搜索学生/备注…" oninput="debounce(loadWrong,300)()">
            <button class="btn sec" onclick="loadWrong()">搜</button>
          </div>
          <div id="wrongList"></div>
        </div>

        <div id="sub-add" class="subpane hidden">
          <div class="card">
            <div id="addQForm"></div>
            <button class="btn ok" style="width:100%;margin-top:8px" onclick="saveNewQuestion()">保存题目</button>
          </div>
        </div>

        <!-- 组卷底部浮条（题库子视图选题目后出现） -->
        <div id="composeBar" class="compose-bar hidden">
          <button class="btn ok" onclick="doComposeSave()">组卷（<span id="cSelCount">0</span>）</button>
          <button class="btn sec" onclick="clearComposeSel()">清空选择</button>
        </div>
      </section>

      <!-- 排课主视图 -->
      <section id="view-schedule" class="main-view hidden">
        <div class="subtabs" id="schedSubTabs">
          <button class="subtab on" data-sub="grid" onclick="schedSub('grid')">排课</button>
          <button class="subtab" data-sub="records" onclick="schedSub('records')">课时</button>
        </div>
        <div id="sub-grid" class="subpane"></div>
        <div id="sub-records" class="subpane hidden"></div>
      </section>

      <!-- 学生主视图 -->
      <section id="view-students" class="main-view hidden">
        <div class="row" style="margin-bottom:10px">
          <button class="btn" style="flex:1" onclick="openStudentEditor(null)">＋ 添加学生</button>
        </div>
        <div id="studentList"></div>
      </section>

      <!-- 设置主视图 -->
      <section id="view-settings" class="main-view hidden">
        <div class="set-group">
          <div class="set-item" onclick="refreshData()"><span class="si-ico">🔄</span><div class="si-main">同步刷新<small class="si-sub">从云端拉取最新数据</small></div><span>›</span></div>
          <div class="set-item" onclick="openBaseUrlEditor()"><span class="si-ico">🌐</span><div class="si-main">后端地址<small class="si-sub" id="setBase">—</small></div><span>›</span></div>
        </div>
        <div class="set-group">
          <div class="set-item" onclick="switchMain('questions');qSub('compose')"><span class="si-ico">🧩</span><div class="si-main">我的组卷 / 试卷</div><span>›</span></div>
          <div class="set-item" onclick="openModuleListEditor('knowledgePoints')"><span class="si-ico">💡</span><div class="si-main">知识点管理</div><span>›</span></div>
          <div class="set-item" onclick="openModuleListEditor('exams')"><span class="si-ico">📋</span><div class="si-main">考试管理</div><span>›</span></div>
        </div>
        <div class="set-group">
          <div class="set-item" onclick="logout()"><span class="si-ico">⏻</span><div class="si-main">退出登录</div><span>›</span></div>
        </div>
        <div class="muted center">邢老师工作台·手机端 · 与电脑端实时同步</div>
      </section>

    </main>

    <!-- 底部四主菜单 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab-btn active" data-main="questions" onclick="switchMain('questions')">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>题库</span>
      </button>
      <button class="tab-btn" data-main="schedule" onclick="switchMain('schedule')">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>排课</span>
      </button>
      <button class="tab-btn" data-main="students" onclick="switchMain('students')">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>学生</span>
      </button>
      <button class="tab-btn" data-main="settings" onclick="switchMain('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <!-- 编辑/详情 弹窗 -->
  <div id="modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBox"></div>
  </div>
  <!-- 知识点选择抽屉 -->
  <div id="kpSheet" class="sheet-overlay hidden" onclick="if(event.target===this)closeKpSheet()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">💡 按知识点筛选</div>
        <button class="btn sec sm" onclick="closeKpSheet()">关闭</button>
      </div>
      <div style="padding:10px 12px 0"><input id="kpSearch" placeholder="搜索知识点名称…" oninput="renderKpTree()"></div>
      <div class="sheet-body" id="kpTree"></div>
    </div>
  </div>
  <!-- 图片灯箱 -->
  <div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
    <img id="lightboxImg" src="" alt="预览">
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js?v=20260922"></script>
</body>
</html>
