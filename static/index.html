<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>邢老师工作台·手机端</title>
<style>
  /* ===== 与桌面版一致的配色与组件体系 ===== */
  :root{
    --primary:#4F46E5; --primary-light:#818CF8; --primary-dark:#3730A3; --primary-bg:#EEF2FF;
    --bg:#F3F4F6; --card-bg:#FFFFFF; --text:#1F2937; --text-muted:#6B7280;
    --border:#E5E7EB; --border-dark:#D1D5DB;
    --success:#10B981; --success-bg:#ECFDF5; --warning:#F59E0B; --warning-bg:#FFFBEB;
    --danger:#EF4444; --danger-bg:#FEF2F2; --info:#3B82F6; --info-bg:#EFF6FF;
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06); --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 30px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--primary);text-decoration:none}
  .hidden{display:none!important}
  .muted{color:var(--text-muted);font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .center{text-align:center;padding:40px 10px;color:var(--text-muted)}

  /* ===== 顶部栏（对应桌面版 app-logo 风格） ===== */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    background:#fff;border-bottom:1px solid var(--border);padding:10px 12px;box-shadow:var(--shadow-sm)}
  .hamburger{width:38px;height:38px;border-radius:var(--radius-sm);font-size:20px;color:var(--primary);
    display:flex;align-items:center;justify-content:center}
  .hamburger:active{background:var(--primary-bg)}
  .top-title{flex:1;font-size:16px;font-weight:600;color:var(--text)}
  .who{font-size:12px;color:var(--text-muted);white-space:nowrap}
  .who:active{color:var(--danger)}

  /* ===== 左侧抽屉导航（对应桌面版 app-sidebar） ===== */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:250px;z-index:50;
    background:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;
    display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .sb-logo{display:flex;align-items:center;gap:8px;padding:20px 18px;font-size:17px;font-weight:700;
    white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.12)}
  .sb-logo .icon{font-size:22px}
  .sb-nav{display:flex;flex-direction:column;gap:4px;padding:14px 12px;flex:1;overflow-y:auto}
  .sb-btn{display:flex;align-items:center;gap:12px;width:100%;color:rgba(255,255,255,.72);
    padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;text-align:left;transition:all .2s}
  .sb-btn .ico{font-size:18px;width:22px;text-align:center}
  .sb-btn:active{background:rgba(255,255,255,.12)}
  .sb-btn.active{color:#fff;background:rgba(255,255,255,.2)}
  .sb-foot{border-top:1px solid rgba(255,255,255,.12);padding:12px}
  .sb-foot .sb-btn{color:rgba(255,255,255,.6);font-size:14px}

  /* ===== 内容区 ===== */
  .content{flex:1;padding:12px;max-width:1100px;width:100%;margin:0 auto}

  /* ===== 卡片（对应桌面版 .card） ===== */
  .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);
    overflow:hidden;padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--text)}
  .card.page{padding:0;overflow:visible}

  /* ===== 标签/徽章（对应桌面版 .badge-primary） ===== */
  .tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;
    background:var(--primary-bg);color:var(--primary);margin-right:5px}
  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
  .badge-success{background:var(--success-bg);color:var(--success)}
  .badge-warning{background:var(--warning-bg);color:var(--warning)}
  .badge-danger{background:var(--danger-bg);color:var(--danger)}
  .badge-info{background:var(--info-bg);color:var(--info)}
  .badge-gray{background:#F3F4F6;color:var(--text-muted)}

  /* ===== 按钮（对应桌面版 .btn 体系） ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
    border-radius:var(--radius-sm);font-size:14px;font-weight:500;background:var(--primary);color:#fff;transition:all .15s;white-space:nowrap}
  .btn:active{opacity:.85}
  .btn.sec{background:#fff;color:var(--text);border:1px solid var(--border-dark)}
  .btn.sec:active{background:var(--bg);border-color:var(--primary);color:var(--primary)}
  .btn.ok{background:var(--success);color:#fff}
  .btn.danger{background:var(--danger-bg);color:var(--danger)}
  .btn.danger:active{background:var(--danger);color:#fff}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.5}

  /* ===== 表单 ===== */
  label.kv{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin:10px 0 6px}
  input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border-dark);border-radius:var(--radius-sm);
    background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
  textarea{min-height:84px;resize:vertical;line-height:1.6}
  .search{display:flex;gap:8px;margin-bottom:10px}
  .search input{flex:1}
  .seg{display:flex;gap:6px;margin:8px 0}
  .seg button{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;font-size:14px}
  .seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* ===== 首页仪表盘（对应桌面版 .stats-grid / .stat-card） ===== */
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  .stat-card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;gap:14px}
  .stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;background:var(--primary-bg);color:var(--primary)}
  .stat-info{flex:1;min-width:0}
  .stat-label{font-size:13px;color:var(--text-muted)}
  .stat-value{font-size:24px;font-weight:700;line-height:1.2}
  .stat-sub{font-size:12px;color:var(--text-muted)}
  .quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .quick-card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;gap:6px;align-items:flex-start;transition:all .15s}
  .quick-card:active{transform:translateY(1px);box-shadow:var(--shadow)}
  .quick-card .qc-ico{width:40px;height:40px;border-radius:10px;background:var(--primary-bg);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .quick-card .qc-title{font-size:15px;font-weight:600}
  .quick-card .qc-sub{font-size:12px;color:var(--text-muted)}

  /* ===== 题目卡片左侧强调条（对应桌面版 question-card） ===== */
  .card.q{border-left:4px solid var(--primary);padding:0}
  .q-content{font-size:14px;line-height:1.7;margin:8px 0;white-space:pre-wrap;word-break:break-word}
  .q-answer{font-size:13px;color:var(--text-muted);background:#F9FAFB;padding:10px 14px;border-radius:var(--radius-sm);
    margin-top:8px;white-space:pre-wrap;border:1px dashed var(--border)}

  /* ===== v6：筛选栏 / 题型 chips ===== */
  .filter-bar{background:var(--bg);padding:2px 0 6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;
    background:#fff;border:1px solid var(--border-dark);font-size:13px;color:var(--text-muted);font-weight:500;transition:all .15s}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.28)}
  .chip.kp{max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .x{font-size:12px;opacity:.8}
  .q-count{font-size:12px;color:var(--text-muted);margin:4px 2px 8px;display:flex;align-items:center;gap:6px}

  /* ===== v6：题目卡片 v6 ===== */
  .q-head{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;padding:12px 14px 2px}
  .q-head .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-kp-line{padding:2px 14px 0}
  .q-kp{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--primary);
    background:var(--primary-bg);padding:2px 9px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-kp:active{background:#E0E7FF}
  .q-body-wrap{padding:4px 14px 0;cursor:pointer}
  .q-ans-toggle{margin:8px 14px 0;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;
    color:var(--info);background:var(--info-bg);padding:6px 12px;border-radius:8px}
  .q-ans-toggle:active{background:#DBEAFE}
  .q-ans-box{margin:8px 14px 0;display:none;border-left:3px solid var(--info);background:var(--info-bg);
    border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .q-ans-box.open{display:block;animation:fadeIn .18s ease}
  .q-ans-box .ans-label{font-weight:600;color:var(--info);margin-bottom:4px}
  .q-actions{display:flex;gap:8px;border-top:1px solid var(--border);margin-top:12px;padding:9px 12px;background:#FAFAFB}
  .q-actions .btn{flex:1;padding:8px 2px;font-size:13px;gap:4px}
  .q-actions .btn.marked{background:var(--danger);color:#fff;border-color:var(--danger)}

  /* ===== v6：知识点选择底部抽屉 ===== */
  .sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:flex-end;animation:fadeIn .15s}
  .sheet{background:#fff;width:100%;max-height:80vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
    box-shadow:var(--shadow-lg);animation:sheetUp .22s ease}
  @keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .sheet-title{font-size:16px;font-weight:600}
  .sheet-body{overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));flex:1}
  .kp-row{display:flex;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--radius-sm);font-size:14px}
  .kp-row:active{background:var(--primary-bg)}
  .kp-toggle{width:26px;height:26px;flex-shrink:0;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);font-size:12px;transition:transform .15s}
  .kp-toggle.open{transform:rotate(90deg)}
  .kp-toggle.leaf{visibility:hidden}
  .kp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kp-row.sel .kp-name{color:var(--primary);font-weight:600}
  .kp-cnt{font-size:12px;color:var(--text-muted);flex-shrink:0}
  .kp-kids{margin-left:16px;border-left:1px dashed var(--border-dark);padding-left:4px;display:none}
  .kp-kids.open{display:block}

  /* ===== v6：图片灯箱 ===== */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;align-items:center;justify-content:center;
    padding:16px;animation:fadeIn .15s}
  .lightbox img{max-width:100%;max-height:92vh;border-radius:8px;object-fit:contain}

  /* ===== v6：错题本 ===== */
  .wn-card{border-left:4px solid var(--danger)}
  .wn-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .wn-note{font-size:12px;color:var(--danger);background:var(--danger-bg);border-radius:6px;padding:4px 8px;margin-top:6px}

  /* ===== 图片 ===== */
  .qimg{max-width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);margin:6px 0;display:block}
  /* 兜底：任何内容区的图片都不允许溢出（覆盖无约束/内联宽高的 img） */
  .q-content img,.q-ans-box img,.q-preview-card img,.modal img,.wn-card img{
    max-width:100%!important;height:auto!important;width:auto!important}

  /* ===== 可移动弧形导航 FAB（取代左上角抽屉） ===== */
  .nav-fab{position:fixed;z-index:46;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 6px 18px rgba(79,70,229,.45);touch-action:none;user-select:none;-webkit-user-select:none;
    cursor:grab;transition:box-shadow .2s, transform .12s, background .25s}
  .nav-fab:active{transform:scale(.94)}
  .nav-fab.dragging{cursor:grabbing;box-shadow:0 12px 30px rgba(79,70,229,.6);transform:scale(1.06)}
  .nav-fab.active{background:linear-gradient(135deg,var(--danger),#b91c1c)}
  .arc-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:43;opacity:0;pointer-events:none;transition:opacity .2s}
  .arc-backdrop.show{opacity:1;pointer-events:auto}
  .arc-layer{position:fixed;inset:0;z-index:44;pointer-events:none}
  .arc-item{position:fixed;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--text);
    box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:20px;line-height:1;pointer-events:none;opacity:0;
    transform:translate(var(--dx,0),var(--dy,0)) scale(0);
    transition:transform .34s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
    will-change:transform,opacity}
  .arc-item.open{opacity:1;transform:translate(0,0) scale(1);pointer-events:auto}
  .arc-item .lbl{font-size:9px;margin-top:3px;line-height:1.05;color:var(--text-muted);
    white-space:normal;width:50px;text-align:center}
  .arc-item:active{background:var(--primary-bg);color:var(--primary)}
  .arc-sub{position:fixed;z-index:45;display:flex;flex-direction:column;gap:8px;
    background:#fff;padding:10px;border-radius:16px;box-shadow:0 12px 32px rgba(15,23,42,.28);
    opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.82);
    transition:opacity .16s ease, transform .2s cubic-bezier(.34,1.56,.64,1)}
  .arc-sub.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .arc-sub-btn{appearance:none;border:0;background:var(--primary-bg);color:var(--primary);
    font-size:14px;font-weight:600;padding:11px 20px;border-radius:11px;white-space:nowrap}
  .arc-sub-btn:active{background:var(--primary);color:#fff}

  /* ===== 弹窗（对应桌面版 .modal-overlay / .modal） ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;
    z-index:60;padding:24px 14px;overflow-y:auto;animation:fadeIn .15s ease}
  .modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;margin:auto;
    max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .2s ease}
  .modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .modal-title{font-size:17px;font-weight:700}
  .modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted)}
  .modal-close:active{background:var(--bg)}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .modal-footer{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:10px;flex-shrink:0;background:#fff}
  .modal-footer .row-2,.modal-footer .row-3{display:flex;gap:10px}
  .modal-footer .row-2 .btn,.modal-footer .row-3 .btn{flex:1;margin:0}
  @keyframes sheetUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  /* ===== 弹窗内：题目预览卡片（标记错题等） ===== */
  .q-preview-card{border:1px solid var(--border);background:var(--bg);border-radius:var(--radius-sm);
    padding:12px 14px;max-height:32vh;overflow-y:auto;margin-bottom:16px}
  .form-group{margin-bottom:12px}
  .kv .opt{font-weight:400;color:var(--text-muted);font-size:12px}

  /* ===== 弹窗内：题目详情分区 ===== */
  .dt-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .dt-sec{margin-bottom:14px}
  .dt-label{display:inline-block;font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-bg);
    padding:3px 12px;border-radius:999px;margin-bottom:8px}
  .dt-label.ans{color:var(--info);background:var(--info-bg)}
  .dt-content{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .dt-content.ans-box{background:var(--info-bg);border-left:3px solid var(--info);padding:10px 14px;border-radius:var(--radius-sm)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  /* ===== 登录（对应桌面版 .auth-overlay） ===== */
  .auth-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);padding:16px}
  .auth-card{width:360px;max-width:92vw;background:var(--card-bg);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:28px 26px}
  .auth-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--primary);margin-bottom:20px}
  .auth-logo{font-size:24px}
  .auth-title{font-size:16px;font-weight:600;margin-bottom:14px}
  .auth-hint{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6}

  /* ===== Toast（对应桌面版 .toast） ===== */
  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);background:var(--text);color:#fff;
    padding:9px 16px;border-radius:var(--radius-sm);z-index:80;opacity:0;transition:.2s;font-size:14px;box-shadow:var(--shadow-lg);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 登录（与桌面版 auth 一致） -->
  <div id="loginView" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand"><span class="auth-logo">📘</span>邢老师工作台</div>
      <div class="auth-title">手机端登录</div>
      <label class="kv">后端地址（部署后自动填充，默认同源）</label>
      <input id="baseUrl" placeholder="https://your-app.up.railway.app" value="">
      <label class="kv">用户名</label>
      <input id="username" placeholder="admin" value="admin">
      <label class="kv">密码</label>
      <input id="password" type="password" placeholder="密码" value="">
      <div style="height:10px"></div>
      <button class="btn" style="width:100%" onclick="doLogin()">登录</button>
      <p class="auth-hint" id="loginMsg">登录云端同步账号，即可在手机上查看 / 添加 / 修改题库、试卷、学生等。</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView" class="hidden">
    <header class="topbar">
      <div class="top-title" id="title">首页</div>
      <button class="btn sec sm" onclick="refreshData()">刷新</button>
      <span class="who" id="who"></span>
    </header>

    <!-- 左侧抽屉导航（与桌面版一致） -->
    <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-logo"><span class="icon">📘</span>邢老师工作台</div>
      <nav class="sb-nav">
        <button class="sb-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="ico">🏠</span><span>首页</span></button>
        <button class="sb-btn" data-tab="questions" onclick="switchTab('questions')"><span class="ico">📚</span><span>题库</span></button>
        <button class="sb-btn" data-tab="wrong" onclick="switchTab('wrong')"><span class="ico">📕</span><span>错题本</span></button>
        <button class="sb-btn" data-tab="papers" onclick="switchTab('papers')"><span class="ico">📄</span><span>试卷</span></button>
        <button class="sb-btn" data-tab="compose" onclick="switchTab('compose')"><span class="ico">🧩</span><span>组卷</span></button>
        <button class="sb-btn" data-tab="students" onclick="switchTab('students')"><span class="ico">👥</span><span>学生</span></button>
        <button class="sb-btn" data-tab="schedule" onclick="switchTab('schedule')"><span class="ico">📅</span><span>排课</span></button>
        <button class="sb-btn" data-tab="records" onclick="switchTab('records')"><span class="ico">📝</span><span>课时</span></button>
        <button class="sb-btn" data-tab="exams" onclick="switchTab('exams')"><span class="ico">📋</span><span>考试</span></button>
        <button class="sb-btn" data-tab="knowledgePoints" onclick="switchTab('knowledgePoints')"><span class="ico">💡</span><span>知识点</span></button>
      </nav>
      <div class="sb-foot">
        <button class="sb-btn" onclick="logout()"><span class="ico">⏻</span><span>退出登录</span></button>
      </div>
    </aside>

    <main class="content" id="body">
      <!-- 首页仪表盘 -->
      <div id="tab-dashboard">
        <div class="stats-grid" id="dashStats"></div>
        <div class="quick-grid">
          <button class="quick-card" onclick="switchTab('compose')"><span class="qc-ico">🧩</span><span class="qc-title">智能组卷</span><span class="qc-sub">按条件抽取题目成卷</span></button>
          <button class="quick-card" onclick="switchTab('schedule')"><span class="qc-ico">📅</span><span class="qc-title">本周排课</span><span class="qc-sub">查看课程安排</span></button>
          <button class="quick-card" onclick="switchTab('questions')"><span class="qc-ico">📚</span><span class="qc-title">题库检索</span><span class="qc-sub">搜索 / 查看题目</span></button>
          <button class="quick-card" onclick="switchTab('students')"><span class="qc-ico">👥</span><span class="qc-title">学生管理</span><span class="qc-sub">课时 / 联系信息</span></button>
        </div>
      </div>

      <!-- 题库 -->
      <div id="tab-questions" class="hidden">
        <div class="search">
          <input id="qSearch" placeholder="搜索题干/答案/编号…" oninput="debounce(loadQuestions,400)()">
          <button class="btn sec" onclick="loadQuestions()">搜</button>
        </div>
        <div class="filter-bar">
          <div class="chips" id="qTypeChips"></div>
          <div class="chips" style="margin-top:8px">
            <button class="chip kp" id="qKpChip" onclick="openKpSheet()">💡 全部知识点</button>
          </div>
        </div>
        <div class="q-count" id="qCount"></div>
        <div id="qList"></div>
        <div class="center"><button class="btn sec" onclick="loadMore()">加载更多</button></div>
      </div>
      <!-- 错题本 -->
      <div id="tab-wrong" class="hidden">
        <div class="search">
          <input id="wrongSearch" placeholder="搜索学生/备注…" oninput="debounce(loadWrong,300)()">
          <button class="btn sec" onclick="loadWrong()">搜</button>
        </div>
        <div id="wrongList"></div>
      </div>
      <!-- 试卷 -->
      <div id="tab-papers" class="hidden"><div id="pList"></div></div>
      <!-- 学生 -->
      <div id="tab-students" class="hidden"><div id="sList"></div></div>
      <!-- 组卷 -->
      <div id="tab-compose" class="hidden">
        <div class="card">
          <label class="kv">试卷标题</label>
          <input id="cTitle" placeholder="如：高二动能定理专题卷">
          <label class="kv">备注</label>
          <input id="cNote" placeholder="可选">
          <div class="kv" style="margin-top:6px">智能抽取规则</div>
          <div class="search"><input id="cKw" placeholder="题干关键词（可空）" oninput="debounce(renderComposePool,300)()"></div>
          <div class="row" style="gap:6px;margin-bottom:6px">
            <select id="cType"><option value="">全部题型</option><option>选择题</option><option>多选题</option><option>填空题</option><option>解答题</option></select>
            <input id="cKp" placeholder="知识点ID(可空)" style="flex:1">
          </div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <label class="kv" style="flex:1">选择题<input id="cN_choice" type="number" value="0" min="0" style="margin-top:2px"></label>
            <label class="kv" style="flex:1">多选题<input id="cN_multi" type="number" value="0" min="0" style="margin-top:2px"></label>
            <label class="kv" style="flex:1">填空题<input id="cN_blank" type="number" value="0" min="0" style="margin-top:2px"></label>
            <label class="kv" style="flex:1">解答题<input id="cN_solve" type="number" value="0" min="0" style="margin-top:2px"></label>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn" onclick="smartCompose()">智能抽取</button>
            <button class="btn sec" onclick="clearCompose()">清空</button>
          </div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between">
            <span class="kv">已选题目（<span id="cCount">0</span>）</span>
            <button class="btn sec sm" onclick="previewCompose()">预览试卷</button>
          </div>
          <div id="composeList"></div>
          <button class="btn ok" style="width:100%;margin-top:8px" onclick="saveCompose()">保存为试卷</button>
        </div>
        <div class="kv">从题库手动添加（点 ＋ 加入）</div>
        <div id="composePool"></div>
      </div>
      <!-- 排课 -->
      <div id="tab-schedule" class="hidden">
        <div class="search">
          <input id="scheduleSearch" placeholder="搜索学生/科目…" oninput="debounce(()=>renderModuleList('schedule'),300)()">
          <button class="btn sec" onclick="renderModuleList('schedule')">搜</button>
        </div>
        <div id="scheduleList"></div>
      </div>
      <!-- 课时 -->
      <div id="tab-records" class="hidden">
        <div class="search">
          <input id="recordsSearch" placeholder="搜索学生/类型/主题…" oninput="debounce(()=>renderModuleList('records'),300)()">
          <button class="btn sec" onclick="renderModuleList('records')">搜</button>
        </div>
        <div id="recordsList"></div>
      </div>
      <!-- 考试 -->
      <div id="tab-exams" class="hidden">
        <div class="search">
          <input id="examsSearch" placeholder="搜索标题/来源/标签…" oninput="debounce(()=>renderModuleList('exams'),300)()">
          <button class="btn sec" onclick="renderModuleList('exams')">搜</button>
        </div>
        <div id="examsList"></div>
      </div>
      <!-- 知识点 -->
      <div id="tab-knowledgePoints" class="hidden">
        <div class="search">
          <input id="knowledgePointsSearch" placeholder="搜索知识点名称/ID…" oninput="debounce(()=>renderModuleList('knowledgePoints'),300)()">
          <button class="btn sec" onclick="renderModuleList('knowledgePoints')">搜</button>
        </div>
        <div id="knowledgePointsList"></div>
      </div>
    </main>

    <!-- 可移动弧形导航 FAB（取代左上角抽屉展开） -->
    <div id="arcBackdrop" class="arc-backdrop" onclick="closeArc()"></div>
    <div id="arcLayer" class="arc-layer"></div>
    <div id="arcSub" class="arc-sub"></div>
    <div id="navFab" class="nav-fab">☰</div>
  </div>

  <!-- 编辑/详情 弹窗 -->
  <div id="modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBox"></div>
  </div>
  <!-- 知识点选择抽屉 -->
  <div id="kpSheet" class="sheet-overlay hidden" onclick="if(event.target===this)closeKpSheet()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">💡 按知识点筛选</div>
        <button class="btn sec sm" onclick="closeKpSheet()">关闭</button>
      </div>
      <div style="padding:10px 12px 0"><input id="kpSearch" placeholder="搜索知识点名称…" oninput="renderKpTree()"></div>
      <div class="sheet-body" id="kpTree"></div>
    </div>
  </div>
  <!-- 图片灯箱 -->
  <div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
    <img id="lightboxImg" src="" alt="预览">
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
