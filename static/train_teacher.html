<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>错题循环训练 · 老师端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#1f2430;font-size:15px}
  .wrap{max-width:900px;margin:0 auto;padding:14px}
  .topbar{background:#4361ee;color:#fff;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:8px 14px;background:#fff;border:1px solid #e6e8ef;border-radius:20px;cursor:pointer}
  .tab.active{background:#4361ee;color:#fff;border-color:#4361ee}
  .card{background:#fff;border:1px solid #e6e8ef;border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;margin:8px 0 4px;color:#5a6072;font-size:13px}
  input,select,textarea{width:100%;padding:9px;border:1px solid #d7dae6;border-radius:8px;font-size:14px;font-family:inherit}
  button{background:#4361ee;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:10px}
  button.ghost{background:#eef4ff;color:#3a56d4}
  button.danger{background:#fdecec;color:#e5484d}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  .err{color:#e5484d;font-size:13px}
  .ok{color:#2e9e5b;font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eef4ff;color:#3a56d4;margin:2px}
  .pill.m{background:#fff3e0;color:#c77700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .stat{background:#fff;border:1px solid #e6e8ef;border-radius:12px;padding:12px;text-align:center}
  .stat b{font-size:22px;display:block}
  img.thumb{max-width:80px;max-height:80px;border-radius:6px;border:1px solid #eee}
  .hidden{display:none!important}
  .chk{display:inline-block;margin:4px 6px 4px 0;background:#f3f5fb;border:1px solid #e2e6f0;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .chk input{width:auto;margin-right:6px}
  .sm{width:auto;padding:8px 12px;font-size:13px;margin:4px 4px 0 0}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .thumbs img{max-width:90px;max-height:90px;border-radius:6px;border:1px solid #eee}
  .thumb-wrap{position:relative;display:inline-block}
  .thumb-wrap .x{position:absolute;top:-7px;right:-7px;background:#e5484d;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .pastezone{border:1px dashed #c7cdf0;border-radius:8px;padding:10px;color:#8a90a2;font-size:13px;cursor:pointer;background:#fafbff;margin-top:6px}
  .pastezone:focus{outline:none;border-color:#4361ee}
  .pastezone.drag{border-color:#4361ee;background:#eef4ff}
  .pract{border:1px solid #d7dae6;background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;margin-left:6px}
  .pract b{color:#4361ee}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60}
  .modal-box{background:#fff;border-radius:12px;padding:16px;max-width:92%;max-height:82%;overflow:auto;min-width:280px}
  .filetag{display:inline-block;background:#eef4ff;color:#3a56d4;border-radius:8px;padding:4px 8px;font-size:12px;margin:3px}
  .qb{border:1px dashed #c7cdf0;border-radius:10px;padding:10px;margin-top:10px;background:#fafbff}
  .qb-item{border:1px solid #e6e8ef;border-radius:10px;padding:10px;margin-top:8px;background:#fff}
  .qb-item img{max-width:100%;border-radius:6px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div><b>错题循环训练</b> · 老师端</div><div id="who"></div></div>

  <div id="login" class="card">
    <h3>登录</h3>
    <div class="row">
      <div><label>用户名</label><input id="u" value="admin"></div>
      <div><label>密码</label><input id="pw" type="password" value="admin123"></div>
    </div>
    <button onclick="login()">登录</button>
    <div id="linfo" class="err"></div>
  </div>

  <div id="app" class="hidden">
    <div class="tabs">
      <div class="tab active" data-t="errors" onclick="switchTab('errors')">错题录入</div>
      <div class="tab" data-t="tasks" onclick="switchTab('tasks')">每日任务</div>
      <div class="tab" data-t="dash" onclick="switchTab('dash')">完成看板</div>
      <div class="tab" data-t="students" onclick="switchTab('students')">学生管理</div>
    </div>

    <!-- 错题录入 -->
    <div id="t-errors">
      <div class="card">
        <h3>录入一道错题</h3>
        <div class="row">
          <div style="flex-basis:100%">
            <label>学生（可多选，错题会发给每一位被选中的学生）</label>
            <div id="e-student-box" style="margin-top:4px"></div>
            <div style="margin-top:6px">
              <button type="button" class="ghost sm" onclick="selAllStu(true)">全选</button>
              <button type="button" class="ghost sm" onclick="selAllStu(false)">清空</button>
            </div>
          </div>
        </div>
        <label>题面（文字或直接 Ctrl+V 粘贴题目图片）</label>
        <textarea id="e-stem" rows="3" placeholder="题目文字，可直接粘贴截图/照片"></textarea>
        <div class="pastezone" data-zone="stem">📋 题目图片：在此处按 <b>Ctrl+V</b> 粘贴，或
          <button type="button" class="ghost sm" onclick="document.getElementById('e-imgs').click()">选择文件</button>
          <button type="button" class="ghost sm" onclick="pasteClip('stem')">从剪贴板粘贴</button>
        </div>
        <div class="thumbs" id="stem-thumbs"></div>
        <input id="e-imgs" type="file" accept="image/*" multiple class="hidden">
        <label>答案 / 解析（可粘贴图片，已取消客观题答案框）</label>
        <textarea id="e-analysis" rows="2" placeholder="解析文字，或 Ctrl+V 粘贴答案图片"></textarea>
        <div class="pastezone" data-zone="analysis">📋 答案图片：在此处按 <b>Ctrl+V</b> 粘贴，或
          <button type="button" class="ghost sm" onclick="document.getElementById('e-ans-imgs').click()">选择文件</button>
          <button type="button" class="ghost sm" onclick="pasteClip('answer')">从剪贴板粘贴</button>
        </div>
        <div class="thumbs" id="analysis-thumbs"></div>
        <input id="e-ans-imgs" type="file" accept="image/*" multiple class="hidden">
        <label>附件（任意文件：PDF / Word / 试卷等，可多选）</label>
        <input id="e-files" type="file" multiple>
        <button type="button" class="ghost" onclick="toggleQb()">📚 从题库选题目</button>
        <div id="qb" class="qb hidden">
          <div class="row">
            <div><label>知识点</label><select id="qb-kp"><option value="">全部知识点</option></select></div>
            <div><label>关键字（题面/标签/来源）</label><input id="qb-q" placeholder="如：牛二、动量"></div>
          </div>
          <button type="button" class="sm" onclick="searchQb()">搜索题库</button>
          <div id="qb-list"></div>
        </div>
        <div id="picked-hint" class="ok hidden"></div>
        <button onclick="saveError()">保存错题</button>
        <div id="e-msg"></div>
      </div>
      <div class="card">
        <h3>错题列表 <span style="font-size:12px;color:#8a90a2">（按学生筛选）</span></h3>
        <select id="f-student" onchange="loadErrors()"><option value="">全部</option></select>
        <div id="err-list"></div>
      </div>
    </div>

    <!-- 每日任务 -->
    <div id="t-tasks" class="hidden">
      <div class="card">
        <h3>生成每日任务</h3>
        <p class="ok">为全体学生生成今天的练习包（到期错题 + 新课巩固，5~8 题）。</p>
        <button onclick="genTasks()">生成今日任务</button>
        <div id="task-msg"></div>
      </div>
      <div class="card">
        <h3>今日任务概况</h3>
        <div id="task-list"></div>
      </div>
    </div>

    <!-- 看板 -->
    <div id="t-dash" class="hidden">
      <div class="card">
        <h3>今日概览</h3>
        <div class="grid" id="dash-overview"></div>
      </div>
      <div class="card">
        <h3>每生进度</h3>
        <div id="dash-student"></div>
      </div>
    </div>

    <!-- 学生管理 -->
    <div id="t-students" class="hidden">
      <div class="card">
        <h3>学生账号管理</h3>
        <p class="ok">给每个学生设置账号和密码后，学生用账号登录 <b>/train_student</b> 只能看到自己的练习，无法看到他人。</p>
        <div id="stu-mgmt"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = location.origin;
let TOKEN = localStorage.getItem('tt_token') || '';

async function call(path, opts={}) {
  opts.headers = opts.headers || {};
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(API + path, opts);
  let j = null; try { j = await r.json(); } catch(e){}
  return {status:r.status, j};
}
function qs(s){return document.querySelector(s).value;}

async function login(){
  const {status,j} = await call('/api/auth/login',{method:'POST',json:{username:qs('#u'),password:qs('#pw')}});
  if(status===200 && j.token){ TOKEN=j.token; localStorage.setItem('tt_token',TOKEN); start(); }
  else document.getElementById('linfo').textContent = (j&&j.error)||'登录失败';
}
function start(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = TOKEN? '已登录':'';
  loadStudents();
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));
  ['errors','tasks','dash','students'].forEach(x=>document.getElementById('t-'+x).classList.toggle('hidden',x!==t));
  if(t==='tasks') renderTasks();
  if(t==='dash') loadDash();
  if(t==='students') loadStuMgmt();
}
async function loadStudents(){
  const {j} = await call('/api/train/students');
  const box = document.getElementById('e-student-box');
  const fsel = document.getElementById('f-student');
  (j?j.items:[]).forEach(s=>{
    const name = s.name||s.username||s.id;
    box.insertAdjacentHTML('beforeend',`<label class="chk"><input type="checkbox" value="${s.id}"> ${name}</label>`);
    fsel.insertAdjacentHTML('beforeend',`<option value="${s.id}">${name}</option>`);
  });
  loadErrors();
}
function selAllStu(on){
  document.querySelectorAll('#e-student-box input').forEach(c=>c.checked=on);
}

// 题库选题意：缓存与状态
let qbCache = {};        // id -> question body
let qbKpName = {};       // kpId -> 名称(来自 knowledgePoints，若无则为空)
let pickedImgs = [];     // 从题库选入的题目图片(相对 /api/media/... 路径)
// 待上传图片（粘贴/选文件），按区域(stem/answer)分别维护
let pendingImgs = {stem:[], answer:[]};
let qbKpLoaded = false;  // 知识点树是否已加载（避免每次展开题库都重拉）

async function uploadMedia(file, sub){
  const fr = await fetch(API+'/api/media?sub='+encodeURIComponent(sub)+'&name='+encodeURIComponent(file.name),{
    method:'POST', headers:{'Authorization':'Bearer '+TOKEN}, body:file
  });
  return await fr.json();
}
// 渲染缩略图（含删除 ×）
function renderThumbs(zone){
  const box = document.getElementById(zone+'-thumbs');
  box.innerHTML='';
  pendingImgs[zone].forEach((it,idx)=>{
    const w = document.createElement('div'); w.className='thumb-wrap';
    w.innerHTML = `<img src="${it.url}"><span class="x" onclick="removeImg('${zone}',${idx})">×</span>`;
    box.appendChild(w);
  });
}
function removeImg(zone, idx){
  const it = pendingImgs[zone][idx];
  if(it && it.url && it.url.startsWith('blob:')) URL.revokeObjectURL(it.url);
  pendingImgs[zone].splice(idx,1);
  renderThumbs(zone);
}
// 把 File 加入待上传列表并预览
function addImgFile(zone, file){
  pendingImgs[zone].push({file, url: URL.createObjectURL(file)});
  renderThumbs(zone);
}
// 监听全局粘贴（无论焦点在题面/解析/粘贴区，都能捕获图片）
function detectZone(){
  const ae = document.activeElement;
  if(ae && ae.dataset && ae.dataset.zone) return ae.dataset.zone;
  if(ae && ae.id==='e-analysis') return 'answer';
  return 'stem';
}
document.addEventListener('paste', function(e){
  const zone = detectZone();
  const cd = e.clipboardData || window.clipboardData;
  const files = [];
  if(cd && cd.items){ for(const it of cd.items){ if(it.kind==='file' && it.type && it.type.startsWith('image/')){ const f=it.getAsFile(); if(f) files.push(f); } } }
  if(!files.length && cd && cd.files){ for(const f of cd.files){ if(f.type && f.type.startsWith('image/')) files.push(f); } }
  if(files.length){ e.preventDefault(); files.forEach(f=>addImgFile(zone, f)); }
}, true);
// 显式“从剪贴板粘贴”按钮：用 Clipboard API 读取（Webview/浏览器均可，需用户点击触发授权）
async function pasteClip(zone){
  try{
    if(!navigator.clipboard || !navigator.clipboard.read){ alert('当前环境不支持剪贴板读取，请直接 Ctrl+V 或选择文件'); return; }
    const items = await navigator.clipboard.read();
    let added=0;
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob = await item.getType(type);
          const ext = (type.split('/')[1]||'png').replace(/[^a-z0-9]/g,'');
          const file = new File([blob], 'clip_'+Date.now()+'.'+ext, {type});
          addImgFile(zone, file); added++;
        }
      }
    }
    if(!added) alert('剪贴板里没有图片，请先截图或复制图片后再点此按钮');
  }catch(err){ alert('读取剪贴板失败：'+((err&&err.message)||err)+'\n可改用 Ctrl+V 或“选择文件”'); }
}
// 选文件输入
['stem','answer'].forEach(zone=>{
  const inp = document.getElementById(zone==='stem'?'e-imgs':'e-ans-imgs');
  if(inp) inp.addEventListener('change', ()=>{ [...inp.files].forEach(f=>addImgFile(zone,f)); inp.value=''; });
});

function toggleQb(){
  const box = document.getElementById('qb');
  box.classList.toggle('hidden');
  if(!box.classList.contains('hidden') && !qbKpLoaded){ loadQbKp(); }
}
async function loadQbKp(){
  // 知识点树来自云端 knowledgePoints（桌面端已整树同步：含 id/name/parentId 层级）
  // 接口直接返回数组：[{id, body:{name,parentId}, updated_at}, ...]
  const {j:kp} = await call('/api/knowledgePoints?limit=3000');
  const items = Array.isArray(kp) ? kp : (kp && kp.items) ? kp.items : [];
  const byId = {};
  items.forEach(x=>{ const b=x.body||{}; byId[x.id]=b.name||x.id; });
  // 如果云端 knowledgePoints 为空，退化方案：从题目里收集不同的 kpId
  let usedFromQ = false;
  if(!items.length){
    const {j} = await call('/api/questions?limit=2000');
    const qs = Array.isArray(j) ? j : (j&&j.items)||[];
    qs.forEach(x=>{ const id=(x.body&&x.body.kpId); if(id){ byId[id]=id; usedFromQ=true; } });
  }
  // 构建层级树（parentId 嵌套）
  const children = {};
  const roots = [];
  Object.keys(byId).forEach(id=>{
    const b = items.find(x=>x.id===id); const pid = b? (b.body&&b.body.parentId)||'' : '';
    (children[pid] = children[pid] || []).push(id);
    if(!pid) roots.push(id);
  });
  const sel = document.getElementById('qb-kp');
  sel.length = 1; // 保留「全部知识点」
  const walk = (id, depth)=>{
    const name = byId[id] || id;
    const pad = depth? '　'.repeat(depth)+'└ ' : '';
    sel.insertAdjacentHTML('beforeend', `<option value="${id}">${pad}${name}</option>`);
    (children[id]||[]).forEach(c=>walk(c, depth+1));
  };
  // 有层级树时按树渲染；否则按 kpId 列表
  if(roots.length || usedFromQ){ roots.forEach(r=>walk(r,0)); }
  else { Object.keys(byId).forEach(id=>sel.insertAdjacentHTML('beforeend',`<option value="${id}">${byId[id]}</option>`)); }
  qbKpLoaded = document.getElementById('qb-kp').options.length > 1;
}
async function searchQb(){
  const kp = document.getElementById('qb-kp').value;
  const kw = document.getElementById('qb-q').value.trim();
  let url = '/api/questions?limit=200';
  if(kp) url += '&kpId='+encodeURIComponent(kp);
  if(kw) url += '&q='+encodeURIComponent(kw);
  const {j} = await call(url);
  const box = document.getElementById('qb-list'); box.innerHTML='';
  const items = (j?j.items:[]) || [];
  if(!items.length){ box.innerHTML='<p class="err">题库里没有匹配的题目</p>'; return; }
  items.forEach(x=>{
    const b = x.body||{}; qbCache[x.id]=b;
    const preview = (b.content||'').replace(/media:\/\//g, API+'/api/media/');
    const name = qbKpName[b.kpId]||b.kpId||'';
    box.insertAdjacentHTML('beforeend', `<div class="qb-item">
      ${preview}
      <div style="font-size:12px;color:#8a90a2;margin-top:4px">${b.grade||''} · ${b.type||''} · ${b.difficulty||''} · ${b.tags||''} · 知识点:${name}</div>
      <button type="button" class="sm" onclick="pickQb('${x.id}')">选入此题</button>
    </div>`);
  });
}
function stripHtml(h){ const d=document.createElement('div'); d.innerHTML=h||''; return (d.textContent||'').trim(); }
function extractMediaRel(h){
  // 把题目的 media:// 图片提取成相对 /api/media/... 路径(供学生端 API+ 拼接)
  const out=[];
  const re=/media:\/\/([^"'\s>]+)/g; let m;
  while((m=re.exec(h||''))){ out.push('/api/media/'+m[1]); }
  return out;
}
function pickQb(id){
  const q = qbCache[id]; if(!q) return;
  document.getElementById('e-stem').value = stripHtml(q.content||'');
  document.getElementById('e-analysis').value = stripHtml(q.answer||'');
  // 题目图(题面+答案)并入待保存图片
  const urls = [...new Set(extractMediaRel(q.content||'').concat(extractMediaRel(q.answer||'')))];
  urls.forEach(u=>{ if(!pickedImgs.includes(u)) pickedImgs.push(u); });
  updatePickedHint();
  document.getElementById('qb').classList.add('hidden');
  const msg = document.getElementById('e-msg');
  msg.textContent = '已从题库选入（'+ (q.type||'题') +'，含'+urls.length+'张图）'; msg.className='ok';
}
function updatePickedHint(){
  const el = document.getElementById('picked-hint');
  if(pickedImgs.length){ el.classList.remove('hidden'); el.textContent='题库带入图片：'+pickedImgs.length+' 张（保存时一并存入错题）'; }
  else el.classList.add('hidden');
}
async function saveError(){
  const msg = document.getElementById('e-msg'); msg.textContent='';
  const ids = [...document.querySelectorAll('#e-student-box input:checked')].map(c=>c.value);
  if(!ids.length){ msg.textContent='请至少选择一个学生'; msg.className='err'; return; }
  // 题面图：题库带入 + 粘贴/选文件
  const images = pickedImgs.slice();
  for(const it of pendingImgs.stem){
    const fj = await uploadMedia(it.file, 'trainErrors');
    if(!fj.ok){ msg.textContent='题面图片上传失败：'+(fj.error||''); msg.className='err'; return; }
    images.push(fj.url.replace(API,''));
  }
  // 答案图：粘贴/选文件
  const answerImages = [];
  for(const it of pendingImgs.answer){
    const fj = await uploadMedia(it.file, 'trainErrors');
    if(!fj.ok){ msg.textContent='答案图片上传失败：'+(fj.error||''); msg.className='err'; return; }
    answerImages.push(fj.url.replace(API,''));
  }
  // 任意附件
  const files = [];
  for(const f of document.getElementById('e-files').files){
    const fj = await uploadMedia(f, 'trainErrors');
    if(!fj.ok){ msg.textContent='附件上传失败：'+(fj.error||''); msg.className='err'; return; }
    files.push({name:f.name, url:fj.url.replace(API,'')});
  }
  const body = {
    studentIds: ids,
    stem: qs('#e-stem'), analysis: qs('#e-analysis'),
    images: images, answerImages: answerImages, files: files, image: images[0]||''
  };
  const {status,j} = await call('/api/train/errors',{method:'POST',json:body});
  if(status!==200){ msg.textContent=(j&&j.error)||'保存失败'; msg.className='err'; return; }
  msg.textContent='已保存 '+ (j.count||ids.length) +' 条错题 ✓'; msg.className='ok';
  document.getElementById('e-stem').value=''; document.getElementById('e-analysis').value='';
  document.getElementById('e-files').value='';
  pendingImgs={stem:[], answer:[]}; renderThumbs('stem'); renderThumbs('answer');
  pickedImgs=[]; updatePickedHint();
  document.querySelectorAll('#e-student-box input:checked').forEach(c=>c.checked=false);
  loadErrors();
}
async function loadErrors(){
  const sid = document.getElementById('f-student').value;
  const [{j},{j:pj}] = await Promise.all([
    call('/api/train/errors'+(sid?'?studentId='+encodeURIComponent(sid):'')),
    call('/api/train/errors/practices'+(sid?'?studentId='+encodeURIComponent(sid):''))
  ]);
  const counts = (pj&&pj.counts)||{};
  const box = document.getElementById('err-list'); box.innerHTML='';
  (j?j.items:[]).forEach(e=>{
    const imgs = (e.images&&e.images.length)?e.images:(e.image?[e.image]:[]);
    const img = imgs.length? `<img class="thumb" src="${API+imgs[0]}">`+(imgs.length>1?` <span class="pill">+${imgs.length-1}图</span>`:''):'';
    const files = (e.files&&e.files.length)?(' <span class="pill m">'+e.files.length+'附件</span>'):'';
    const ans = (e.answerImages&&e.answerImages.length)?' <span class="pill">'+e.answerImages.length+'答案图</span>':'';
    const n = counts[e.id]||0;
    box.insertAdjacentHTML('beforeend',`<div class="card" style="margin:8px 0">
      <div class="row" style="align-items:center">
        <div>${img}</div>
        <div style="flex:3">
          <div>${e.knowledgePoint?('<b>'+e.knowledgePoint+'</b> '):'<b>错题</b> '}${e.errorReason?('<span class="pill">'+e.errorReason+'</span> '):''}${e.source?('<span class="pill m">'+e.source+'</span>'):''}${files}${ans}</div>
          <div style="color:#8a90a2;font-size:12px">${e.studentName||e.studentId} · ${e.wrongDate||''}</div>
          <div style="font-size:13px">${(e.stem||'').slice(0,80)}</div>
        </div>
        <div>
          <button class="pract" onclick="showPractices('${e.id}')">练习 <b>${n}</b> 次</button>
          <button class="danger" onclick="delErr('${e.id}')">删</button>
        </div>
      </div></div>`);
  });
}
async function showPractices(eid){
  const {j} = await call('/api/train/errors/'+eid+'/practices');
  const logs = (j&&j.logs)||[];
  const stuname = {};
  (j&&j.logs); // 已在 logs 内
  let h = '<div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center"><b>练习记录（共 '+logs.length+' 次）</b><button class="ghost sm" onclick="closeModal()">关闭</button></div>';
  if(!logs.length) h += '<p style="color:#8a90a2">还没有学生练习过这道题。</p>';
  else {
    h += '<table><tr><th>日期</th><th>结果</th></tr>';
    logs.slice().reverse().forEach(l=>{
      const r = l.result==='right'||l.result==='self_right'?'✓ 做对':l.result==='half'?'半对':'✗ 做错';
      h += '<tr><td>'+(l.date||'')+'</td><td>'+r+'</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';
  showModalHtml(h);
}
function showModalHtml(html){
  let mask = document.getElementById('modal-mask');
  if(!mask){ mask=document.createElement('div'); mask.id='modal-mask'; mask.className='modal-mask'; document.body.appendChild(mask); }
  mask.innerHTML = html + '<div style="position:fixed;inset:0;z-index:-1" onclick="closeModal()"></div>';
  mask.style.display='flex';
}
function closeModal(){ const m=document.getElementById('modal-mask'); if(m) m.style.display='none'; }
async function delErr(id){
  if(!confirm('确认删除这道错题？（同时清除对应训练卡）')) return;
  await call('/api/train/errors/'+id,{method:'DELETE'}); loadErrors();
}
async function loadStuMgmt(){
  const [{j:stus},{j:acc},{j:errs}] = await Promise.all([
    call('/api/train/students'),
    call('/api/train/student/accounts'),
    call('/api/train/errors')
  ]);
  const accMap = {};
  (acc?acc.items:[]).forEach(a=>accMap[a.studentId]=a.username);
  // 统计每位学生的错题数（一道错题可能发给多名学生，逐一累加）
  const errCount = {};
  (errs?errs.items:[]).forEach(e=>{
    (e.studentIds||[]).forEach(id=>{ errCount[id]=(errCount[id]||0)+1; });
  });
  const box = document.getElementById('stu-mgmt'); box.innerHTML='';
  (stus?stus.items:[]).forEach(s=>{
    const name = s.name||s.username||s.id;
    const has = accMap[s.id];
    const cnt = errCount[s.id]||0;
    box.insertAdjacentHTML('beforeend',`<div class="card" style="margin:8px 0">
      <div class="row" style="align-items:center">
        <div style="flex:2"><b>${name}</b><br><span style="font-size:12px;color:${has?'#2e9e5b':'#8a90a2'}">${has?('已设账号: '+has):'未设账号'}</span><br><span class="pill m">错题 ${cnt} 道</span></div>
        <div style="flex:3">
          <input id="su_${s.id}" placeholder="账号" value="${has||''}">
          <input id="sp_${s.id}" type="password" placeholder="${has?'留空=不修改密码':'密码'}">
        </div>
        <div>
          <button onclick="setStu('${s.id}','${name.replace(/'/g,"\\'")}')">保存</button>
          <button type="button" class="ghost" onclick="viewStuErrors('${s.id}')">查看错题</button>
        </div>
      </div></div>`);
  });
}
// 在「错题录入」标签里按学生筛选并展示该生错题
async function viewStuErrors(sid){
  switchTab('errors');
  const sel = document.getElementById('f-student');
  if(sel){ sel.value = sid; }
  await loadErrors();
}
async function setStu(sid,name){
  const username = document.getElementById('su_'+sid).value.trim();
  const password = document.getElementById('sp_'+sid).value;
  if(!username){ alert('请填写账号'); return; }
  if(!password){ alert('请填写密码（首次设置或修改都需填）'); return; }
  const {status,j} = await call('/api/train/student/account',{method:'POST',json:{studentId:sid,username,password}});
  if(status!==200){ alert((j&&j.error)||'保存失败'); return; }
  alert('已保存「'+name+'」的账号 ✓'); loadStuMgmt();
}
async function genTasks(){
  const {j} = await call('/api/train/tasks/generate',{method:'POST'});
  document.getElementById('task-msg').textContent = (j&&j.students!=null)? ('已为 '+j.students+' 名学生生成 '+j.date+' 任务 ✓'):'生成失败';
  renderTasks();
}
async function renderTasks(){
  const {j} = await call('/api/train/tasks?date='+new Date().toISOString().slice(0,10));
  const box = document.getElementById('task-list'); box.innerHTML='';
  (j?j.items:[]).forEach(t=>{
    box.insertAdjacentHTML('beforeend',`<div style="padding:6px;border-bottom:1px solid #eee">
      <b>${(t.studentName)||t.studentId}</b> · ${t.date} · 共${t.errorIds.length}题 · 状态:${t.status} ${t.score!=null?('· 正确率'+(t.score*100).toFixed(0)+'%'):''}</div>`);
  });
}
async function loadDash(){
  const {j} = await call('/api/train/dashboard');
  if(!j){return;}
  document.getElementById('dash-overview').innerHTML =
    stat(j.studentsTotal,'学生总数')+stat(j.tasksToday,'今日任务')+stat(j.doneToday,'今日完成')+stat(j.todayDate,'日期');
  const box = document.getElementById('dash-student');
  let h='<table><tr><th>学生</th><th>循环中</th><th>已毕业</th><th>新收录</th><th>今日</th><th>正确率</th></tr>';
  (j.perStudent||[]).forEach(s=>{
    h+=`<tr><td>${s.name||s.id}</td><td>${s.active}</td><td>${s.mastered}</td><td>${s.new}</td><td>${s.todayStatus}</td><td>${s.todayScore!=null?(s.todayScore*100).toFixed(0)+'%':'-'}</td></tr>`;
  });
  box.innerHTML=h+'</table>';
}
function stat(v,l){return `<div class="stat"><b>${v}</b>${l}</div>`;}

if(TOKEN){ start(); }
</script>
