<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>错题循环训练 · 老师端</title>
<style>
  :root{
    --bg:#F7F3EE; --surface:#FFFDFA; --surface2:#FCF8F2;
    --ink:#2E2823; --ink2:#6B6157; --ink3:#A79C8E;
    --line:#EDE4D8; --line2:#E1D5C4;
    --brand:#B87248; --brand2:#D9A172; --brand3:#8E5633; --brand-soft:#F9EFE4;
    --gold:#A9834A;
    --ok:#5F8A66; --ok-soft:#EDF3EE;
    --warn:#B8863F; --warn-soft:#FCF3E6;
    --err:#A9605A; --err-soft:#F9EEEC;
    --r:16px; --r-sm:12px; --r-xs:10px;
    --sh1:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(93,72,50,.05), 0 1px 1px rgba(93,72,50,.04);
    --sh2:inset 0 1px 0 rgba(255,255,255,.7), 0 2px 6px rgba(93,72,50,.06), 0 12px 28px rgba(93,72,50,.07);
    --sh3:0 24px 60px rgba(60,44,28,.22), 0 6px 16px rgba(60,44,28,.10);
    --ring:0 0 0 3px rgba(184,114,72,.15);
    --grad:linear-gradient(180deg, var(--brand2) 0%, var(--brand) 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  ::selection{background:var(--brand-soft);color:var(--brand3)}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 420px at 50% -140px, #FFF9F1 0%, rgba(255,249,241,0) 70%);
    background-attachment:fixed;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:14px 18px 64px}
  h3{margin:0 0 10px;font-size:15px;font-weight:650;letter-spacing:.2px;color:var(--ink)}
  label{display:block;margin:0 0 5px;color:var(--ink3);font-size:11.5px;font-weight:600;letter-spacing:.06em}
  .hint{color:var(--ink3);font-size:12.5px;line-height:1.6}
  .ok{color:var(--ok);font-size:13px}
  .err{color:var(--err);font-size:13px}

  /* ---------- 顶部标题与关键指标 ---------- */
  .app-head{
    position:sticky;top:0;z-index:25;margin:0 -18px 14px;padding:12px 18px 12px;
    background:linear-gradient(180deg, rgba(247,243,238,.94) 55%, rgba(247,243,238,.72));
    backdrop-filter:saturate(1.1) blur(8px);border-bottom:1px solid rgba(225,213,196,.5);
  }
  .app-head .ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .ph-title{font-size:21px;font-weight:700;letter-spacing:-.2px;color:var(--ink);line-height:1.25}
  .ph-sub{color:var(--ink3);font-size:12.5px;margin-top:2px}
  .kpis{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
  .kpi{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:7px 13px;min-width:88px;box-shadow:var(--sh1);transition:box-shadow .18s, transform .18s;
  }
  .kpi:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
  .kpi b{display:block;font-size:19px;font-weight:700;color:var(--brand3);
    font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.2}
  .kpi span{font-size:11.5px;color:var(--ink3);letter-spacing:.04em}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin-bottom:14px;box-shadow:var(--sh1);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 10px;
    text-align:center;box-shadow:var(--sh1);transition:box-shadow .18s, transform .18s;
  }
  .stat:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
  .stat b{font-size:24px;display:block;color:var(--brand3);font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.15}
  .stat span{color:var(--ink3);font-size:11.5px;letter-spacing:.04em}

  /* ---------- 区块标题（细线分隔，非色块）---------- */
  .sec{
    display:flex;align-items:center;gap:12px;margin:26px 0 12px;padding:0;background:none;border:0;
    font-size:15px;font-weight:650;color:var(--ink);letter-spacing:.2px;
  }
  .sec>span:first-child{display:inline-flex;align-items:center;gap:9px}
  .sec .no{
    display:inline-grid;place-items:center;width:22px;height:22px;border-radius:8px;
    font-size:12px;font-weight:700;font-style:normal;color:#fff;letter-spacing:0;
    background:linear-gradient(150deg,var(--brand2),var(--brand));
    box-shadow:0 2px 7px rgba(142,86,51,.30), inset 0 1px 0 rgba(255,255,255,.28);
    font-variant-numeric:tabular-nums;
  }
  .sec .hr{flex:1;height:1px;background:linear-gradient(90deg,var(--line2) 0%, rgba(225,213,196,.15) 100%)}
  .sec .rules-btn{
    display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
    background:var(--surface);color:var(--brand3);border:1px solid var(--line2);border-radius:999px;
    font-size:12.5px;font-weight:600;white-space:nowrap;
    box-shadow:var(--sh1);transition:background .16s, transform .16s, box-shadow .16s;
  }
  .sec .rules-btn .ic{width:14px;height:14px}
  .sec .rules-btn:hover{background:var(--brand-soft);transform:translateY(-1px);box-shadow:var(--sh2)}
  .sec .rules-btn:active{transform:translateY(0)}

  /* ---------- 输入控件 ---------- */
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r-xs);
    font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);
    transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  input::placeholder,textarea::placeholder{color:#C4BAAB}
  input:hover,select:hover,textarea:hover{border-color:#D8C9B4}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);box-shadow:var(--ring);background:var(--surface)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%, calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  textarea{line-height:1.7;resize:vertical}

  /* ---------- 按钮设计系统 ----------
     变体：默认=主操作(陶土渐变) / .tint=柔和强调 / .ghost=描边次操作 / .danger=危险
     尺寸：默认 36px / .sm 30px / .lg 40px / .icon 方形
     图标：<svg class="ic"><use href="#i-save"/></svg>（线性描边，随文字色自动继承）
  ------------------------------------------------------------------ */
  button{
    font-family:inherit;cursor:pointer;border:1px solid transparent;border-radius:10px;
    font-size:13.5px;font-weight:600;letter-spacing:.01em;height:36px;padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
    color:#fff;background:var(--grad);
    box-shadow:0 1px 2px rgba(142,86,51,.20), inset 0 1px 0 rgba(255,255,255,.22);
    transition:background .16s ease,color .16s ease,border-color .16s ease,
               box-shadow .16s ease,transform .07s ease,filter .16s ease,opacity .16s ease;
  }
  button:hover{filter:brightness(1.04);box-shadow:0 3px 10px rgba(142,86,51,.20), inset 0 1px 0 rgba(255,255,255,.22)}
  button:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(142,86,51,.18)}
  button:focus-visible{outline:0;box-shadow:var(--ring)}
  button:disabled{opacity:.5;filter:grayscale(.2);cursor:not-allowed;transform:none;box-shadow:none}
  /* 描边次操作 */
  button.ghost{
    background:var(--surface);color:var(--ink2);border-color:var(--line2);box-shadow:var(--sh1);
  }
  button.ghost:hover{background:var(--brand-soft);color:var(--brand3);filter:none;box-shadow:var(--sh2)}
  /* 柔和强调 */
  button.tint{
    background:var(--brand-soft);color:var(--brand3);border-color:transparent;box-shadow:var(--sh1);
  }
  button.tint:hover{filter:none;box-shadow:var(--sh2);background:var(--brand-soft);color:var(--brand3)}
  /* 危险（描边式，避免列表里过红） */
  button.danger{
    background:var(--surface);color:var(--err);border-color:var(--line2);box-shadow:var(--sh1);
  }
  button.danger:hover{background:var(--err-soft);border-color:#EFD9D5;filter:none;box-shadow:var(--sh2)}
  /* 尺寸 */
  button.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px;gap:5px}
  button.lg{height:40px;padding:0 18px;font-size:14px;border-radius:11px;gap:8px}
  button.icon{width:32px;height:32px;padding:0;border-radius:9px}
  button.icon.sm{width:28px;height:28px;border-radius:8px}
  /* 图标 */
  .ic{
    width:15px;height:15px;flex:0 0 auto;display:block;
    fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  }
  button.sm .ic{width:13.5px;height:13.5px}
  button.lg .ic{width:16px;height:16px}
  button.icon .ic{width:15.5px;height:15.5px}
  .ic-inline{width:14px;height:14px;display:inline-block;vertical-align:-2px;
    fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  /* 按钮内数字徽标 */
  .bn{
    display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    background:rgba(255,255,255,.24);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
    transition:background .16s ease;
  }
  button.ghost .bn,button.tint .bn,button.danger .bn{background:var(--brand-soft);color:var(--brand3)}
  button.danger .bn{background:var(--err-soft);color:var(--err)}
  /* 分段控件（一组互斥/并列的小操作） */
  .seg{
    display:inline-flex;gap:2px;padding:3px;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh1);
  }
  .seg button{
    height:30px;padding:0 12px;font-size:12.5px;border-radius:9px;gap:5px;
    background:transparent;color:var(--ink2);border:0;box-shadow:none;
  }
  .seg button:hover{background:var(--surface);color:var(--brand3);filter:none;box-shadow:var(--sh1)}
  .seg button .ic{width:13.5px;height:13.5px}
  /* 行内计数胶囊按钮（错题列表：练习 N 次 / 答案图 N 张） */
  .pillbtn{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;
    background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
    font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:none;
    transition:background .16s,color .16s,border-color .16s,box-shadow .16s;
  }
  .pillbtn:hover{background:var(--brand-soft);color:var(--brand3);border-color:var(--line2);box-shadow:var(--sh1)}
  .pillbtn b{color:var(--brand3);font-variant-numeric:tabular-nums;font-weight:700}
  .pillbtn .ic{width:13px;height:13px}
  /* 兼容旧类名（漏改处也不难看） */
  button.pract{
    background:var(--surface2);color:var(--ink2);border-color:var(--line);border-radius:999px;
    height:28px;padding:0 11px;font-size:12px;box-shadow:none;
  }
  button.pract:hover{background:var(--brand-soft);color:var(--brand3);filter:none}

  /* ---------- 布局辅助 ---------- */
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:150px}
  .row2{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row2>*{flex:1;min-width:170px}
  .qa-cols{display:flex;gap:16px;flex-wrap:wrap}
  .qa-cols>div{flex:1;min-width:280px}
  .hidden{display:none!important}

  /* 工具栏下方：题库搜索行 */
  .qb .qb-acts{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}
  /* 学生下拉里的操作行 */
  .drop-acts{display:flex;gap:6px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  /* 每日任务：主操作 + 说明 */
  .tbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .tbar .hint{flex:1;min-width:180px}
  /* ---------- 录入区工具条（字段区 + 竖分隔 + 操作区）---------- */
  .tb-fields{display:flex;gap:12px;flex-wrap:wrap;flex:1 1 320px;min-width:250px}
  .tb-fields .fld{flex:1;min-width:148px;position:relative}
  .tb-tools{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
  .tb-sep{width:1px;align-self:stretch;min-height:38px;background:var(--line2);opacity:.7;margin:0 1px}
  /* 保存条里的数字徽标更醒目 */
  .savebar .bn{background:rgba(255,255,255,.26)}
  /* ---------- 任务/看板 详情卡 ---------- */
  .detail{
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);
    box-shadow:var(--sh1);display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;transition:box-shadow .2s ease
  }
  .detail:hover{box-shadow:var(--sh2)}
  .detail .dt-main{min-width:170px;line-height:1.6}
  .detail .dt-main b{font-size:14.5px;letter-spacing:.01em}
  .detail .dt-sub{color:var(--ink3);font-size:12.5px}
  .detail .dt-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  /* ---------- 批量待发列表 ---------- */
  .batch-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
    border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface);
    font-size:13.5px;box-shadow:var(--sh1)
  }
  /* 折叠标题右侧的计数 */
  .collapse-head .tt{display:inline-flex;align-items:center;gap:8px}
  /* 弹窗头部 */
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)
  }
  .modal-head b{font-size:15px;letter-spacing:.01em}
  /* 学生管理卡 */
  .stu-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--sh1)}
  .stu-card .sc-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .stu-card .sc-info{flex:0 0 165px;min-width:150px}
  .stu-card .sc-info b{font-size:15px}
  .stu-card .sc-fields{flex:1 1 240px;display:flex;gap:9px;flex-wrap:wrap}
  .stu-card .sc-fields>div{flex:1;min-width:120px}
  .stu-card .sc-acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .stu-card .sc-greet{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2)}
  .stu-card .sc-greet .grow{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
  /* ---------- 录入区工具条 ---------- */
  .toolbar{
    display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:16px;padding:14px;
    background:var(--surface2);border:1px solid var(--line);border-radius:14px;
  }
  .toolbar .tb-left{display:flex;gap:12px;flex-wrap:wrap;flex:1;min-width:280px}
  .toolbar .tb-left .fld{flex:1;min-width:160px;position:relative}
  .toolbar .tb-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar .tb-actions button{margin:0;white-space:nowrap}
  #stu-drop{
    position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line2);
    border-radius:14px;margin-top:6px;padding:10px;box-shadow:var(--sh3);max-height:280px;overflow:auto;
  }
  #stu-drop .chk{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);margin:0;font-size:13.5px}
  #stu-drop .chk:last-child{border-bottom:none}
  .chk{display:inline-block;margin:4px 6px 4px 0;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
  .chk input{width:auto;margin-right:6px}

  /* ---------- 保存条（有层次的悬浮条）---------- */
  .savebar{
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:13px 15px;
    background:linear-gradient(180deg,var(--surface) 0%, var(--brand-soft) 140%);
    border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh2);
  }
  .savebar .hint{flex:1;min-width:200px}
  .savebar button{margin:0;white-space:nowrap}

  /* ---------- 缩略图 ---------- */
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{max-width:92px;max-height:92px;border-radius:10px;border:1px solid var(--line);box-shadow:var(--sh1)}
  .thumb-wrap{position:relative;display:inline-block}
  .thumb-wrap .x{
    position:absolute;top:-7px;right:-7px;background:var(--err);color:#fff;border-radius:50%;width:19px;height:19px;
    line-height:19px;text-align:center;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)
  }
  img.thumb{max-width:84px;max-height:84px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
  .pastezone{
    border:1.5px dashed var(--line2);border-radius:12px;padding:12px;color:var(--ink3);font-size:13px;
    cursor:pointer;background:var(--surface);margin-top:8px;transition:border-color .16s, background .16s
  }
  .pastezone:hover{border-color:var(--brand2);background:var(--brand-soft)}
  .pastezone.drag{border-color:var(--brand2);background:var(--brand-soft)}
  .filetag{
    display:inline-block;background:var(--surface);color:var(--brand3);border:1px solid var(--line2);border-radius:999px;
    padding:4px 10px;font-size:12px;margin:4px 4px 0 0;box-shadow:var(--sh1)
  }

  /* ---------- 题库选择 / 待发列表 ---------- */
  .qb{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:var(--surface2)}
  .qb-item{
    border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--surface);
    box-shadow:var(--sh1);transition:box-shadow .18s, transform .18s
  }
  .qb-item:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
  .qb-item img{max-width:100%;border-radius:10px;margin-top:6px}
  .qb-pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;margin-bottom:6px}
  .qb-pick input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
  .qb-batch{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;
    background:var(--surface);border:1px dashed var(--primary);border-radius:12px;font-size:13.5px;box-shadow:var(--sh1)}
  .batch-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
    border:1px solid var(--line2);border-radius:12px;margin-top:8px;background:var(--surface);font-size:13.5px;box-shadow:var(--sh1)
  }
  .pract{
    border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 11px;
    font-size:12px;font-weight:500;cursor:pointer;margin-left:6px;box-shadow:var(--sh1);letter-spacing:0;
    transition:background .16s, border-color .16s, transform .16s
  }
  .pract:hover{background:var(--brand-soft);border-color:#E5D2BC;transform:translateY(-1px)}
  .pract b{color:var(--brand3);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- 错题列表：行式布局 ---------- */
  .err-row{
    display:flex;gap:16px;align-items:flex-start;padding:14px 6px;border-bottom:1px solid var(--line);
    border-radius:10px;transition:background .16s
  }
  .err-row:last-child{border-bottom:0}
  .err-row:hover{background:#FDF9F3}
  .er-thumb{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;max-width:190px}
  .er-main{flex:1;min-width:0}
  .er-line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
  .er-line2{color:var(--ink3);font-size:12px;margin-top:3px;letter-spacing:.02em}
  .er-stem{
    font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .er-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-top:2px}
  .er-actions .danger{color:var(--err)}
  .er-noimg{
    color:var(--ink3);font-size:12px;border:1px dashed var(--line2);border-radius:10px;
    padding:20px 16px;background:#FFFDFA
  }

  /* ---------- 折叠区块 ---------- */
  .collapse-head{
    display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:9px 12px;
    margin:-6px -10px;border-radius:12px;transition:background .16s
  }
  .collapse-head:hover{background:var(--surface2)}
  .collapse-head .tt{font-size:15px;font-weight:650;color:var(--ink)}
  .collapse-head .chev{margin-left:auto;color:var(--ink3);font-size:12px;transition:transform .2s ease}
  .collapse-head.open .chev{transform:rotate(90deg)}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}
  th{color:var(--ink2);font-weight:600;font-size:12px;letter-spacing:.04em;background:var(--surface2)}
  tbody tr:hover td{background:#FDF9F3}
  tbody tr:last-child td{border-bottom:0}

  /* ---------- 徽标 ---------- */
  .pill{
    display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
    background:var(--brand-soft);color:var(--brand3);border:1px solid #EFE0CE;margin:2px
  }
  .pill.m{background:var(--warn-soft);color:var(--warn);border-color:#EFDFC4}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:#DCE8DD}

  /* ---------- 弹窗 ---------- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(46,40,35,.42);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:60;animation:fadeIn .16s ease
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;
    max-width:92%;max-height:84%;overflow:auto;min-width:280px;box-shadow:var(--sh3)
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rules-table{border-collapse:collapse;margin:8px 0;width:100%}
  .rules-table th,.rules-table td{border:1px solid var(--line2);padding:6px 9px;font-size:12.5px;text-align:center}
  .rules-table th{background:var(--surface2);color:var(--ink2)}
  .rules-box li{margin:6px 0;line-height:1.7}

  /* ---------- 滚动条 ---------- */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#DCCFBB;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#CDBEA6;background-clip:padding-box}

  @media (min-width:1500px){
    .main-inner{max-width:1240px}
    .app-head .ph-row{max-width:1196px}
  }

  @media (max-width:520px){
    .wrap{padding:12px 12px 60px}
    .app-head{margin:0 -12px 12px;padding:10px 12px}
    .ph-title{font-size:19px}
    .kpi{min-width:76px;padding:6px 10px}
    .kpi b{font-size:17px}
    .card{padding:14px}
  }

  /* ==================================================================
     高级增强：深色侧栏外壳 / 双主题 / 入场动效 / 聚焦模式

  /* ---- 深色主题（暖黑 + 陶土金）---- */
  body.theme-dark{

    --ink:#F0E7DB; --ink2:#C3B6A6; --ink3:#8B7F70;

    --brand:#C98A5A; --brand2:#DCA877; --brand3:#E9BE94; --brand-soft:#372C23;

    --warn:#D2A45F; --warn-soft:#332A1D;
    --err:#CE837B; --err-soft:#342423;
    --sh1:inset 0 1px 0 rgba(255,255,255,.045), 0 1px 2px rgba(0,0,0,.30);
    --sh2:inset 0 1px 0 rgba(255,255,255,.055), 0 2px 6px rgba(0,0,0,.34), 0 12px 28px rgba(0,0,0,.30);

  /* ---- 青竹皮肤（严格对齐参考图：浅豆绿 + 微绿白 + 近黑文字）---- */
  body[data-skin="sage"]{

    --ok:#5F8A66; --ok-soft:#EDF3EE;

    --err:#A9605A; --err-soft:#F9EEEC;
    --sh1:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(90,120,95,.05), 0 1px 1px rgba(90,120,95,.04);

  body[data-skin="sage"] .side-nav a.active::before{ background:var(--brand2); box-shadow:0 0 12px rgba(141,174,146,.7); }
  body[data-skin="sage"] .side-foot button.on{ background:rgba(141,174,146,.22); border-color:rgba(141,174,146,.45); }
  /* 青竹 · 侧栏外壳（严格对齐参考图：浅豆绿侧栏） */
  body[data-skin="sage"] .side{
    background:#E3ECE4;

  /* ---- 灰白皮肤（微信式：深黑侧栏 + 浅灰白主区）---- */
  body[data-skin="stone"]{
    --bg:#F5F5F5; --surface:#FFFFFF; --surface2:#F0F0F2;
    --ink:#1B1C1E; --ink2:#4E5154; --ink3:#8A8C8E;
    --line:#E8E8EA; --line2:#DCDCDE;
    --brand:#565B61; --brand2:#7E848B; --brand3:#3F4348; --brand-soft:#EEEEF0;
    --gold:#6E7277;
    --ok:#5F8A66; --ok-soft:#EDF3EE;
    --warn:#B8863F; --warn-soft:#FCF3E6;
    --err:#A9605A; --err-soft:#F9EEEC;
    --sh1:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(45,50,58,.05), 0 1px 1px rgba(45,50,58,.04);
    --sh2:inset 0 1px 0 rgba(255,255,255,.7), 0 2px 6px rgba(45,50,58,.06), 0 12px 28px rgba(45,50,58,.07);

    --grad:linear-gradient(180deg, var(--brand2) 0%, var(--brand) 100%);

  body[data-skin="stone"] .app-head{

  }
  body[data-skin="stone"] .side{
    background:#2E2E2E;
    color:rgba(255,255,255,.72); border-right-color:rgba(0,0,0,.3);
    box-shadow:1px 0 0 rgba(255,255,255,.03), 14px 0 44px rgba(0,0,0,.18);
  }
  body[data-skin="stone"] .side-brand{ border-bottom-color:rgba(255,255,255,.07); }
  body[data-skin="stone"] .side-brand .bi{ filter:none; }
  body[data-skin="stone"] .side-brand .bt{ color:#F0F0F0; }
  body[data-skin="stone"] .side-brand .bs{ color:#8A8C8E; }
  body[data-skin="stone"] .side-nav .nv-label{ color:#8A8C8E; }
  body[data-skin="stone"] .side-nav a{ color:rgba(255,255,255,.6); }
  body[data-skin="stone"] .side-nav a:hover{ background:rgba(255,255,255,.08); color:#fff; }
  body[data-skin="stone"] .side-nav a.active{ background:rgba(255,255,255,.14); color:#fff; }
  body[data-skin="stone"] .side-nav a.active::before{ background:var(--brand2, #7E848B); box-shadow:0 0 10px rgba(126,132,139,.6); }
  body[data-skin="stone"] .side-nav a .cnt{ color:#9CA2AA; background:rgba(255,255,255,.07); }
  body[data-skin="stone"] .side-nav a.active .cnt{ color:#fff; background:rgba(255,255,255,.14); }
  body[data-skin="stone"] .side-foot{ border-top-color:rgba(255,255,255,.07); }

  body[data-skin="stone"] .side-foot button:hover{ background:rgba(255,255,255,.13); color:#fff; }
  body[data-skin="stone"] .side-foot button.on{ background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.3); }
  body[data-skin="stone"] .err-row:hover{ background:#F4F6F8; }
  body[data-skin="stone"] tbody tr:hover td{ background:#F4F6F8; }

  /* ---- 灰白皮肤 · 深色（石墨暗色）---- */
  body.theme-dark[data-skin="stone"]{
    --bg:#16181B; --surface:#1E2126; --surface2:#26292E;
    --ink:#E9EBEE; --ink2:#C6CBD1; --ink3:#9CA2AA;
    --line:#2A2D32; --line2:#34383E;
    --brand:#AEB6C0; --brand2:#C6CDD5; --brand3:#8A929C; --brand-soft:#26292E;
    --gold:#8FA6B0;
    --ok:#8FB08F; --ok-soft:#28311F;
    --warn:#D2A45F; --warn-soft:#332A1D;
    --err:#CE837B; --err-soft:#342423;
    --sh1:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.30);
    --sh2:inset 0 1px 0 rgba(255,255,255,.055), 0 2px 6px rgba(0,0,0,.34), 0 12px 28px rgba(0,0,0,.30);
    --sh3:0 24px 60px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.40);
    --ring:0 0 0 3px rgba(174,182,192,.24);
    background-image:radial-gradient(1100px 400px at 50% -160px, #1E2126 0%, rgba(30,33,38,0) 72%);
  }
  body.theme-dark[data-skin="stone"] .app-head{
    background:linear-gradient(180deg, rgba(22,24,27,.95) 58%, rgba(22,24,27,.72));
    border-bottom-color:rgba(255,255,255,.07);
  }
  body.theme-dark[data-skin="stone"] .side{ background:linear-gradient(180deg,#101215 0%,#0B0D0F 100%); }
  body.theme-dark[data-skin="stone"] .pastezone{ background:var(--surface); }
  body.theme-dark[data-skin="stone"] .modal-mask{ background:rgba(8,10,12,.62); }
  body.theme-dark[data-skin="stone"] ::-webkit-scrollbar-thumb{ background:#2E3238; }
  body.theme-dark[data-skin="stone"] ::-webkit-scrollbar-thumb:hover{ background:#3A3F45; }
  body.theme-dark[data-skin="stone"] .err-row:hover{ background:#26292E; }
  body.theme-dark[data-skin="stone"] tbody tr:hover td{ background:#26292E; }

  /* ---- 应用外壳 ---- */
  .shell{display:flex;align-items:flex-start;min-height:100vh}
  .side{
    position:sticky;top:0;flex:0 0 228px;width:228px;height:100vh;
    display:flex;flex-direction:column;z-index:30;
    background:linear-gradient(180deg,#312A24 0%,#231E1A 100%);
    color:#D8CCBC;border-right:1px solid rgba(0,0,0,.28);
    box-shadow:1px 0 0 rgba(255,255,255,.03), 14px 0 44px rgba(60,44,28,.10);
    animation:sideIn .5s cubic-bezier(.22,.61,.36,1) both;
  }
  body.theme-dark .side{
    background:linear-gradient(180deg,#17130F 0%,#120F0D 100%);
    border-right-color:rgba(255,255,255,.055);
    box-shadow:1px 0 0 rgba(255,255,255,.03), 14px 0 44px rgba(0,0,0,.35);
  }
  @keyframes sideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .side-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
  .side-brand .bi{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;
    background:linear-gradient(150deg,var(--brand2),var(--brand3));
    box-shadow:0 5px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .side-brand .bt{font-size:14.5px;font-weight:650;color:#F4ECE2;letter-spacing:.3px;line-height:1.25}
  .side-brand .bs{font-size:10px;color:#8E8272;letter-spacing:.18em;margin-top:2px}
  .side-brand{border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
  .side-nav{flex:1;padding:8px 10px;overflow:auto}
  .side-nav .nv-label{
    font-size:10px;letter-spacing:.18em;color:#726658;padding:14px 10px 6px;font-weight:700
  }
  .side-nav a{
    display:flex;align-items:center;gap:10px;padding:9px 11px;margin:2px 0;border-radius:11px;
    color:#C6B9A8;font-size:13.5px;font-weight:550;cursor:pointer;position:relative;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  .side-nav a .ic{width:16px;height:16px;flex:0 0 auto;opacity:.8;
    fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
  .side-nav a:hover{background:rgba(255,255,255,.065);color:#fff;transform:translateX(2px)}
  .side-nav a.active{background:rgba(217,161,114,.17);color:#fff;font-weight:700}
  .side-nav a.active::before{
    content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--brand2);
    box-shadow:0 0 12px rgba(217,161,114,.75)
  }
  .side-nav a .cnt{
    margin-left:auto;font-size:11px;color:#8B7E6E;font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.06);border-radius:999px;padding:1px 7px
  }
  .side-nav a.active .cnt{color:#F0DEC9;background:rgba(255,255,255,.12)}
  .side-foot{padding:12px 14px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:8px}
  .side-foot button{
    flex:1;margin:0;height:34px;padding:0 10px;gap:6px;
    background:rgba(255,255,255,.065);color:#D8CCBC;border:1px solid rgba(255,255,255,.11);
    border-radius:11px;font-size:12.5px;font-weight:600;box-shadow:none;letter-spacing:.02em
  }
  .side-foot button .ic{width:14px;height:14px;opacity:.9}
  .side-foot button:hover{background:rgba(255,255,255,.13);color:#fff;filter:none;box-shadow:none}
  .side-foot button.on{background:rgba(217,161,114,.22);color:#fff;border-color:rgba(217,161,114,.45)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .main-inner{padding:0 22px;max-width:1180px;width:100%;margin:0 auto}
  .app-head .ph-row{max-width:1136px;margin:0 auto}

  /* 页头在 .main 内固定 */
  .app-head{
    position:sticky;top:0;z-index:25;margin:0 0 14px;padding:14px 22px 12px;
    background:linear-gradient(180deg, rgba(247,243,238,.95) 58%, rgba(247,243,238,.72));
    backdrop-filter:saturate(1.12) blur(9px);
    border-bottom:1px solid rgba(225,213,196,.55);
  }
  body.theme-dark .app-head{
    background:linear-gradient(180deg, rgba(30,26,22,.95) 58%, rgba(30,26,22,.72));
    border-bottom-color:rgba(255,255,255,.07);
  }
  #login{max-width:430px;margin:11vh auto 0}

  /* ---- 入场动效 ---- */
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
  /* 注意：用 backwards 而非 both —— both 会把 opacity 锁在 1，
     导致聚焦模式的淡出失效 */
  .reveal{animation:rise .52s cubic-bezier(.22,.61,.36,1) backwards}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none!important} .side{animation:none!important}
  }

  /* ---- 聚焦模式：录入时其余区块淡出 ---- */
  #t-tasks, #t-dash, #t-students, #sec-tasks, #sec-dash, #sec-students,
  #t-errors > .card:nth-child(2){
    transition:opacity .34s ease, transform .34s ease, filter .34s ease;
  }
  body.focus-mode .side-nav a:not(.active){opacity:.45}
  body.focus-mode #t-tasks, body.focus-mode #sec-tasks,
  body.focus-mode #t-dash, body.focus-mode #sec-dash,
  body.focus-mode #t-students, body.focus-mode #sec-students{
    opacity:.16; transform:scale(.992); filter:grayscale(.5) blur(.4px); pointer-events:none;
  }
  body.focus-mode #t-errors > .card:nth-child(2){
    opacity:.28; filter:grayscale(.4); pointer-events:none;
  }
  /* 当前区块轻微提亮 */
  #t-errors > .card{transition:box-shadow .3s ease, transform .3s ease}
  body.focus-mode #t-errors > .card:first-child{box-shadow:var(--sh2), 0 0 0 1px var(--line2)}

  /* ---- 滚动定位锚点（避免被 sticky 页头遮住）---- */
  .sec, #t-errors, #t-tasks, #t-dash, #t-students{scroll-margin-top:96px}

  /* ---- 深色下的细节 ---- */
  body.theme-dark .pastezone{background:var(--surface)}
  body.theme-dark .modal-mask{background:rgba(10,8,6,.6)}
  body.theme-dark ::-webkit-scrollbar-thumb{background:#4A4038;background-clip:padding-box}
  body.theme-dark ::-webkit-scrollbar-thumb:hover{background:#5A4E44;background-clip:padding-box}
  body.theme-dark .err-row:hover{background:#2C2623}
  body.theme-dark tbody tr:hover td{background:#2C2623}
  body.theme-dark .kpi b, body.theme-dark .stat b{color:var(--brand3)}

  /* ---- 响应式：窄屏侧栏转顶部横条 ---- */
  @media (max-width:900px){
    .shell{flex-direction:column}
    .side{
      position:sticky;top:0;flex:none;width:100%;height:auto;flex-direction:row;align-items:center;
      padding:8px 10px;gap:6px;animation:none;
      border-right:0;border-bottom:1px solid rgba(0,0,0,.3);
      box-shadow:0 6px 18px rgba(60,44,28,.18);
    }
    .side-brand{padding:0 8px 0 4px;gap:8px}
    .side-brand .bi{width:30px;height:30px;border-radius:9px;font-size:15px}
    .side-brand .bt{font-size:13px} .side-brand .bs{display:none}
    .side-nav{display:flex;gap:2px;padding:0;overflow-x:auto;flex:1}
    .side-nav .nv-label{display:none}
    .side-nav a{padding:7px 11px;white-space:nowrap;font-size:13px}
    .side-nav a .ic{display:none}
    .side-nav a .cnt{display:none}
    .side-nav a.active::before{display:none}
    .side-nav a.active{box-shadow:inset 0 0 0 1px rgba(217,161,114,.35)}
    .side-foot{border-top:0;padding:0;gap:5px;flex:0 0 auto}
    .side-foot button{height:30px;padding:0 9px;font-size:12px;gap:0}
    .side-foot button .lf{display:none}
    .main-inner{padding:0 12px;max-width:none}
    .tb-sep{display:none}
    .tb-fields{flex:1 1 100%}
    .app-head{padding:10px 12px 9px;margin-bottom:12px}
    .app-head .ph-row{max-width:none}
    .kpis{justify-content:flex-start;width:100%}
    .ph-title{font-size:18px}
    .sec, #t-errors, #t-tasks, #t-dash, #t-students{scroll-margin-top:76px}
  }

  /* ================= 手机端适配（≤640px）：单列 / 大触控 / 底部弹层 ================= */
  @media (max-width:640px){
    /* 顶部横条更紧凑 */
    .side{padding:6px 8px;gap:6px}
    .side-brand .bi{width:26px;height:26px;border-radius:8px;font-size:14px}
    .side-brand .bt{font-size:12.5px}
    .side-nav a{padding:6px 10px;font-size:12.5px}
    .side-foot button{height:28px;padding:0 8px}

    .main-inner{padding:0 10px}
    .app-head{margin:0 -10px 12px;padding:10px 12px 9px}
    .ph-title{font-size:17px}
    .ph-sub{display:none}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
    .kpi{min-width:0;padding:6px 4px;text-align:center}
    .kpi b{font-size:16px}
    .kpi span{font-size:10px}
    .card{padding:13px;border-radius:14px}
    .sec{margin:18px 0 10px;font-size:14px}

    /* 表单一律单列、撑满 */
    .qa-cols{gap:12px}
    .qa-cols>div,.row>*,.row2>*,.tb-fields,.tb-fields .fld,
    .toolbar .tb-left,.toolbar .tb-left .fld,
    .stu-card .sc-info,.stu-card .sc-fields,.stu-card .sc-fields>div,
    .stu-card .grow{flex:1 1 100%!important;min-width:0!important}
    /* 行内写死的固定宽度/最小宽度统一拉满 */
    [style*="flex:0 0 220px"],[style*="flex:0 0 200px"],[style*="flex:0 0 190px"],
    [style*="flex:0 0 165px"],[style*="flex:0 0 150px"]{flex:1 1 100%!important}
    [style*="min-width:300px"],[style*="min-width:240px"],[style*="min-width:180px"],
    [style*="min-width:170px"],[style*="min-width:150px"]{min-width:0!important}

    .toolbar{padding:12px;gap:10px}
    .tb-sep{display:none}
    .seg{width:100%}
    .seg button{flex:1}
    .tb-tools{width:100%}
    .tb-tools .tint{flex:1 1 100%}
    .tbar{gap:8px}
    .tbar button.lg{width:100%}

    /* 保存条竖排、按钮整行 */
    .savebar{flex-direction:column;align-items:stretch;gap:10px}
    .savebar button{width:100%}

    /* 错题条目 / 详情卡 竖排 */
    .err-row{flex-direction:column;align-items:stretch;gap:8px}
    .er-actions{flex-direction:row;justify-content:flex-end}
    .detail{flex-direction:column;align-items:stretch}
    .detail .dt-main{min-width:0}
    .detail .dt-acts{width:100%}
    .detail .dt-acts button{flex:1}
    .stu-card .sc-acts button{flex:1 1 auto}
    .stu-card .grow button{width:100%}

    /* 触控目标更大 */
    button,.ghost,.tint{min-height:38px}
    button.sm,.ghost.sm,.tint.sm{min-height:34px}
    .qb-item .chk, #stu-drop .chk{min-height:34px}

    /* 缩略图更小，一屏可看多张 */
    .thumbs img,.thumb-wrap img{max-width:26vw;max-height:26vw}
    img.thumb{max-width:28vw;max-height:28vw}

    /* 弹窗改底部抽屉、可滚动 */
    .modal-mask{align-items:flex-end!important;padding:0!important}
    .modal-box{width:100%!important;max-width:100vw!important;max-height:88vh;overflow:auto;
      margin:0!important;border-radius:16px 16px 0 0!important}
    .modal-box table,.rules-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}

    /* 看板统计 */
    .grid{grid-template-columns:repeat(auto-fill,minmax(29%,1fr));gap:8px}
    .stat b{font-size:20px}
    .sec,#t-errors,#t-tasks,#t-dash,#t-students{scroll-margin-top:64px}
  }

  /* ============================================================
     2026-09-30 手机端改版：中性商务配色 + 底部导航 + 单页切换 + 文字按钮
     ============================================================ */
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface2:#F7F8FA;
    --ink:#1F2430; --ink2:#5B6472; --ink3:#98A1AF;
    --line:#E8EBF0; --line2:#DCE0E7;
    --brand:#4F46E5; --brand2:#6366F1; --brand3:#4338CA; --brand-soft:#EEF2FF;
    --primary:#4F46E5; --gold:#8B93A1;
    --ok:#2E9E5B; --ok-soft:#EAF6EF;
    --warn:#B8863F; --warn-soft:#FCF3E6;
    --err:#DC4C4C; --err-soft:#FDECEC;
    --sh1:0 1px 2px rgba(16,24,40,.04);
    --sh2:0 4px 12px rgba(16,24,40,.06);
    --sh3:0 20px 48px rgba(16,24,40,.16);
    --ring:0 0 0 3px rgba(79,70,229,.15);
  }
  body{background:var(--bg);background-image:none!important;color:var(--ink)}

  /* 顶栏隐藏（各页有自己的标题） */
  .app-head{display:none!important}

  /* ===== 布局：宽屏=左侧栏（电脑端），窄屏=底部导航（手机端） ===== */
  .shell{display:flex;align-items:flex-start;min-height:100vh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .main-inner{padding:16px 22px 84px;max-width:none;width:100%;margin:0}

  /* 侧栏（电脑端）：干净白底 + 中性选中 */
  .side{
    position:sticky;top:0;flex:0 0 200px;width:200px;height:100vh;
    display:flex;flex-direction:column;z-index:40;animation:none!important;
    background:#fff;color:var(--ink);border:0;border-right:1px solid var(--line);box-shadow:none;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .side-brand .bi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;
    background:var(--brand-soft);color:var(--brand);box-shadow:none}
  .side-brand .bt{font-size:14px;font-weight:650;color:var(--ink);letter-spacing:0}
  .side-brand .bs{display:none}
  .side-nav{flex:1;padding:10px 10px 16px;overflow:auto}
  .side-nav .nv-label{display:none!important}
  .side-nav a{
    display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:10px;
    color:var(--ink2);font-size:13.5px;font-weight:550;cursor:pointer;transform:none!important;
    transition:background .15s,color .15s;
  }
  .side-nav a .ic{width:17px;height:17px;opacity:1;stroke-width:1.7}
  .side-nav a:hover{background:rgba(16,24,40,.05)!important;color:var(--ink)!important}
  .side-nav a.active{background:var(--brand-soft)!important;color:var(--brand)!important;font-weight:650!important}
  .side-nav a.active::before{display:none!important}
  .side-nav a .cnt{display:none!important}
  .side-foot{display:none!important}

  /* 窄屏：侧栏 → 底部固定导航 */
  @media (max-width:900px){
    .shell{display:block}
    .main{display:block}
    .main-inner{padding:14px 14px calc(80px + env(safe-area-inset-bottom))}
    .side{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex:none;
      flex-direction:row;border-right:0;border-top:1px solid var(--line);
      box-shadow:0 -1px 0 rgba(16,24,40,.03), 0 -10px 26px rgba(16,24,40,.06);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .side-brand{display:none!important}
    .side-nav{display:flex;padding:0;overflow:visible;flex:none}
    .side-nav a{
      flex:1;flex-direction:column;gap:3px;justify-content:center;text-align:center;
      padding:9px 2px;margin:0;border-radius:0;color:var(--ink3);font-size:11px;font-weight:500;
    }
    .side-nav a .ic{width:21px;height:21px}
    .side-nav a:hover{background:transparent!important;color:var(--ink2)!important}
    .side-nav a.active{background:transparent!important;color:var(--primary)!important;font-weight:600!important}
  }

  /* 区块标题：去彩色数字块 */
  .sec{color:var(--ink)}
  .sec .no{background:#EDEFF3!important;color:var(--ink2)!important;box-shadow:none!important}
  .sec .hr{background:var(--line)!important}

  /* 输入控件更素 */
  input,select,textarea{border-color:var(--line2);background:#fff}
  select{background-image:none!important;padding-right:11px!important}
  label{color:var(--ink3)}

  /* 按钮：文字按钮去边框去底色；主按钮仅用主色文字 */
  button{background:transparent;border:0;box-shadow:none;color:var(--ink);font-weight:600}
  button:hover{background:rgba(16,24,40,.045);filter:none;box-shadow:none}
  button:active{background:rgba(16,24,40,.08)}
  button.ghost,button.tint,button.sm,.seg button,.pillbtn,.qb-acts button{
    background:transparent!important;border:0!important;box-shadow:none!important;color:var(--ink)
  }
  button.ghost:hover,button.tint:hover,.seg button:hover,.pillbtn:hover{background:rgba(16,24,40,.045)!important;color:var(--ink)!important}
  button.tint{color:var(--primary)!important}
  button.lg,.savebar button,.tbar button.lg{
    background:transparent!important;border:0!important;box-shadow:none!important;
    color:var(--primary)!important;font-weight:650
  }
  button.lg:hover,.savebar button:hover{background:rgba(79,70,229,.07)!important}
  button.danger{background:transparent!important;border:0!important;color:var(--err)!important}
  button.danger:hover{background:rgba(220,76,76,.08)!important}
  .seg{border:0!important;background:transparent!important;box-shadow:none!important}
  .sec .rules-btn{background:transparent!important;border:0!important;box-shadow:none!important;color:var(--ink2)!important}
  .sec .rules-btn:hover{background:rgba(16,24,40,.045)!important;color:var(--ink)!important;transform:none!important}

  #login{margin-top:14vh}

  /* ===== 2026-09-30 再次精简：固定保存条 / 输入框内选图 / 按钮排整齐 / 去虚线框 ===== */
  /* 输入框 + 内嵌「选图/拍照」相机按钮（点框内相机即可选手机照片或截图） */
  .imgbox{position:relative}
  .imgbox textarea{padding-bottom:40px}
  .imgbox .ins-img{
    position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;padding:0;
    background:var(--brand-soft);color:var(--brand);
  }
  .imgbox .ins-img .ic{width:20px;height:20px}
  .imgbox .ins-img:hover{background:var(--brand);color:#fff}
  .qa-cols{gap:12px}

  /* 工具条：按钮规整排布（去掉说明文字后不再需要字段块/分隔线） */
  .toolbar{position:relative;flex-wrap:wrap;gap:8px;padding:12px}
  .toolbar>button,.toolbar>.tk,.toolbar>select{flex:1 1 auto}
  .toolbar .tk{min-width:150px}
  .tb-fields,.tb-sep,.tb-tools,.seg{display:none!important}

  /* 题库筛选行排整齐 */
  .qb-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .qb-filters select{flex:1 1 150px}
  .qb-filters input{flex:1 1 170px}
  .qb-filters button{flex:0 0 auto}

  /* 题库多选：去掉虚线大框，单行排布 */
  .qb-batch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;padding:0;border:0;background:none;box-shadow:none}
  .qb-batch .qb-cnt{color:var(--ink3);font-size:12.5px;white-space:nowrap}
  .qb-batch .qb-cnt b{color:var(--brand3);font-variant-numeric:tabular-nums}
  .qb-item-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* 录入页：操作侧栏（电脑端右侧固定、手机端成一组） */
  .entry-layout{display:flex;gap:16px;align-items:flex-start}
  .entry-main{flex:1;min-width:0}
  .entry-side{flex:0 0 232px;position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;
    background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px}
  .entry-side .side-title{font-size:12px;font-weight:650;color:var(--ink3);letter-spacing:.04em;margin-bottom:2px}
  .entry-side button,.entry-side select{width:100%}
  .entry-side button{justify-content:flex-start}
  .entry-side button.lg{justify-content:center}
  .entry-side #stu-drop{position:static;left:auto;right:auto;top:auto;margin-top:6px;max-height:240px}
  .entry-side .batch-item{flex-direction:column;align-items:stretch;gap:6px}
  .entry-side #stu-actions{display:flex;flex-direction:column;gap:8px}
  .entry-side #clean-msg{font-size:12.5px;color:var(--ink3)}
  .entry-side #e-msg:empty{display:none}
  #batch-box:empty{display:none}
  @media (max-width:900px){
    .entry-layout{display:block}
    .entry-side{position:static;margin-top:12px}
  }

  /* 去掉遗留说明文字 */
  #picked-hint{display:none!important}
</style>
</head>

<script>
const API = location.origin;
let TOKEN = localStorage.getItem('tt_token') || '';

async function call(path, opts={}) {
  opts.headers = opts.headers || {};
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(API + path, opts);
  let j = null; try { j = await r.json(); } catch(e){}
  return {status:r.status, j};
}
function qs(s){return document.querySelector(s).value;}

async function login(){
  const {status,j} = await call('/api/auth/login',{method:'POST',json:{username:qs('#u'),password:qs('#pw')}});
  if(status===200 && j.token){ TOKEN=j.token; localStorage.setItem('tt_token',TOKEN); start(); }
  else document.getElementById('linfo').textContent = (j&&j.error)||'登录失败';
}
async function start(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initTheme();
  await loadStudents();          // 先取到学生，再填充「每日任务 / 完成看板」的学生下拉，避免选不了
  loadKpOptions();
  renderTasks(); loadDash(); loadStuMgmt();
  goSec('sec-errors');
  requestAnimationFrame(()=>{ animateIn(); });
}
// loadStudents 完成后刷新「任务 / 看板 / 学生管理」里的学生下拉
async function refreshStuSelects(){
  fillStuSelect('task-stu'); renderTaskStu();
  fillStuSelect('dash-stu'); renderDashStu();
  fillStuSelect('mgmt-stu'); renderMgmt();
}
async function autoLogin(){
  try{
    const {status,j} = await call('/api/auth/login',{method:'POST',json:{username:'admin',password:'admin123'}});
    if(status===200 && j.token){ TOKEN=j.token; localStorage.setItem('tt_token',TOKEN); }
  }catch(e){}
  if(TOKEN){ start(); }
  else { document.getElementById('login').classList.remove('hidden'); }
}
function switchTab(t){}
async function loadStudents(){
  const {j} = await call('/api/train/students');
  const box = document.getElementById('e-student-box');
  const fsel = document.getElementById('f-student');
  window._STU_MAP = {};
  if(box) box.innerHTML = '';
  if(fsel) fsel.innerHTML = '<option value="">全部学生</option>';
  (j?j.items:[]).forEach(s=>{
    const name = s.name||s.username||s.id;
    window._STU_MAP[s.id]=name;
    if(box) box.insertAdjacentHTML('beforeend',`<label class="chk"><input type="checkbox" value="${s.id}"> ${name}</label>`);
    if(fsel) fsel.insertAdjacentHTML('beforeend',`<option value="${s.id}">${name}</option>`);
  });
  loadErrors();
  refreshStuSelects();   // 学生变化后同步刷新「任务/看板/学生管理」的下拉
}
function selAllStu(on){
  document.querySelectorAll('#e-student-box input').forEach(c=>c.checked=on);
  updateStuDropText();
}
// 学生下拉多选：展开/收起 + 按钮计数
function toggleStuDrop(){
  const d = document.getElementById('stu-drop');
  d.classList.toggle('hidden');
}
function updateStuDropText(){
  const n = document.querySelectorAll('#e-student-box input:checked').length;
  const t = document.getElementById('stu-drop-txt');
  if(t) t.textContent = n ? ('已选学生（' + n + '）') : '选择学生（0）';
}
document.addEventListener('change', e=>{
  if(e.target.closest && e.target.closest('#e-student-box')) updateStuDropText();
});
document.addEventListener('click', e=>{
  const d = document.getElementById('stu-drop');
  if(!d || d.classList.contains('hidden')) return;
  if(e.target.closest && (e.target.closest('#stu-drop') || e.target.closest('#stu-drop-btn'))) return;
  d.classList.add('hidden');
});

// 题库选题意：缓存与状态
let qbCache = {};        // id -> question body
let qbKpName = {};       // kpId -> 名称(来自 knowledgePoints，若无则为空)
let pickedImgs = [];     // 从题库选入的题目图片(相对 /api/media/... 路径)
let pickedAnsImgs = [];  // 从题库选入的【答案】图片 -> 存 answerImages，学生提交后才可见
// 待上传图片（粘贴/选文件），按区域(stem/answer)分别维护
let pendingImgs = {stem:[], answer:[]};
let qbKpLoaded = false;  // 知识点树是否已加载（避免每次展开题库都重拉）

async function uploadMedia(file, sub){
  // 粘贴/拍照的文件名常为固定 image.png，会互相覆盖 → 强制加唯一前缀
  const uniq = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const name = uniq + '_' + (file.name || 'img.png');
  const fr = await fetch(API+'/api/media?sub='+encodeURIComponent(sub)+'&name='+encodeURIComponent(name),{
    method:'POST', headers:{'Authorization':'Bearer '+TOKEN}, body:file
  });
  return await fr.json();
}
// 渲染缩略图（含删除 ×）
function renderThumbs(zone){
  const box = document.getElementById(zone+'-thumbs');
  box.innerHTML='';
  pendingImgs[zone].forEach((it,idx)=>{
    const w = document.createElement('div'); w.className='thumb-wrap';
    w.innerHTML = `<img src="${it.url}"><span class="x" onclick="removeImg('${zone}',${idx})">×</span>`;
    box.appendChild(w);
  });
}
function removeImg(zone, idx){
  const it = pendingImgs[zone][idx];
  if(it && it.url && it.url.startsWith('blob:')) URL.revokeObjectURL(it.url);
  pendingImgs[zone].splice(idx,1);
  renderThumbs(zone);
}
// 把 File 加入待上传列表并预览
function addImgFile(zone, file){
  pendingImgs[zone].push({file, url: URL.createObjectURL(file)});
  renderThumbs(zone);
}
// 监听全局粘贴（无论焦点在题面/解析/粘贴区，都能捕获图片）
// zone 统一为 stem/answer（历史 data-zone="analysis" 也映射到 answer）
function normZone(z){ return z==='analysis'?'answer':z; }
function detectZone(e){
  const pick = el=>{
    if(!el) return null;
    if(el.dataset && el.dataset.zone) return normZone(el.dataset.zone);
    if(el.id==='e-analysis') return 'answer';
    if(el.id==='e-stem') return 'stem';
    const pz = el.closest && el.closest('.pastezone');
    if(pz && pz.dataset.zone) return normZone(pz.dataset.zone);
    return null;
  };
  return pick(e&&e.target) || pick(document.activeElement) || window._lastZone || 'stem';
}
// 记录最后点击的粘贴区（点击后按钮/区域失焦时仍能贴对位置）
document.addEventListener('click', function(e){
  const pz = e.target.closest && e.target.closest('.pastezone');
  if(pz && pz.dataset.zone) window._lastZone = normZone(pz.dataset.zone);
}, true);
document.addEventListener('paste', function(e){
  const zone = detectZone();
  const cd = e.clipboardData || window.clipboardData;
  const files = [];
  if(cd && cd.items){ for(const it of cd.items){ if(it.kind==='file' && it.type && it.type.startsWith('image/')){ const f=it.getAsFile(); if(f) files.push(f); } } }
  if(!files.length && cd && cd.files){ for(const f of cd.files){ if(f.type && f.type.startsWith('image/')) files.push(f); } }
  if(files.length){ e.preventDefault(); files.forEach(f=>addImgFile(zone, f)); }
}, true);
// 显式“从剪贴板粘贴”按钮：用 Clipboard API 读取（Webview/浏览器均可，需用户点击触发授权）
async function pasteClip(zone){
  try{
    if(!navigator.clipboard || !navigator.clipboard.read){ alert('当前环境不支持剪贴板读取，请直接 Ctrl+V 或选择文件'); return; }
    const items = await navigator.clipboard.read();
    let added=0;
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob = await item.getType(type);
          const ext = (type.split('/')[1]||'png').replace(/[^a-z0-9]/g,'');
          const file = new File([blob], 'clip_'+Date.now()+'.'+ext, {type});
          addImgFile(zone, file); added++;
        }
      }
    }
    if(!added) alert('剪贴板里没有图片，请先截图或复制图片后再点此按钮');
  }catch(err){ alert('读取剪贴板失败：'+((err&&err.message)||err)+'\n可改用 Ctrl+V 或“选择文件”'); }
}
// 选文件输入
['stem','answer'].forEach(zone=>{
  const inp = document.getElementById(zone==='stem'?'e-imgs':'e-ans-imgs');
  if(inp) inp.addEventListener('change', ()=>{ [...inp.files].forEach(f=>addImgFile(zone,f)); inp.value=''; });
});

function toggleQb(){
  const box = document.getElementById('qb');
  box.classList.toggle('hidden');
  if(!box.classList.contains('hidden') && !qbKpLoaded){ loadQbKp(); }
}
async function loadQbKp(){
  // 知识点树来自云端 knowledgePoints（桌面端已整树同步：含 id/name/parentId 层级）
  // 接口直接返回数组：[{id, body:{name,parentId}, updated_at}, ...]
  const {j:kp} = await call('/api/knowledgePoints?limit=3000');
  const items = Array.isArray(kp) ? kp : (kp && kp.items) ? kp.items : [];
  const byId = {};
  items.forEach(x=>{ const b=x.body||{}; byId[x.id]=b.name||x.id; });
  // 如果云端 knowledgePoints 为空，退化方案：从题目里收集不同的 kpId
  let usedFromQ = false;
  if(!items.length){
    const {j} = await call('/api/questions?limit=2000');
    const qs = Array.isArray(j) ? j : (j&&j.items)||[];
    qs.forEach(x=>{ const id=(x.body&&x.body.kpId); if(id){ byId[id]=id; usedFromQ=true; } });
  }
  // 构建层级树（parentId 嵌套）
  const children = {};
  const roots = [];
  Object.keys(byId).forEach(id=>{
    const b = items.find(x=>x.id===id); const pid = b? (b.body&&b.body.parentId)||'' : '';
    (children[pid] = children[pid] || []).push(id);
    if(!pid) roots.push(id);
  });
  const sel = document.getElementById('qb-kp');
  sel.length = 1; // 保留「全部知识点」
  const walk = (id, depth)=>{
    const name = byId[id] || id;
    const pad = depth? '　'.repeat(depth)+'└ ' : '';
    sel.insertAdjacentHTML('beforeend', `<option value="${id}">${pad}${name}</option>`);
    (children[id]||[]).forEach(c=>walk(c, depth+1));
  };
  // 有层级树时按树渲染；否则按 kpId 列表
  if(roots.length || usedFromQ){ roots.forEach(r=>walk(r,0)); }
  else { Object.keys(byId).forEach(id=>sel.insertAdjacentHTML('beforeend',`<option value="${id}">${byId[id]}</option>`)); }
  qbKpLoaded = document.getElementById('qb-kp').options.length > 1;
}
async function searchQb(){
  const kp = document.getElementById('qb-kp').value;
  const kw = document.getElementById('qb-q').value.trim();
  let url = '/api/questions?limit=3000';  // 取全量题库，避免只搜到最新 200 条、其它知识点搜不到
  if(kp) url += '&kpId='+encodeURIComponent(kp);
  if(kw) url += '&q='+encodeURIComponent(kw);
  const {j} = await call(url);
  const box = document.getElementById('qb-list'); box.innerHTML='';
  const items = (j?j.items:[]) || [];
  if(!items.length){ box.innerHTML='<p class="err">题库里没有匹配的题目</p>'; return; }
  items.forEach(x=>{
    const b = x.body||{}; qbCache[x.id]=b;
    const preview = (b.content||'').replace(/media:\/\//g, API+'/api/media/');

    box.insertAdjacentHTML('beforeend', `<div class="qb-item">

      <div class="qb-item-acts">
        <button type="button" class="tint sm" onclick="qbAddOne('${x.id}')"><svg class="ic"><use href="#i-plus"/></svg>加入待发列表</button>

  });
  box.insertAdjacentHTML('beforeend', `<div class="qb-batch"><span class="qb-cnt">待发列表已有 <b id="qb-batch-n">${batchErrs.length}</b> 道</span></div>`);

function stripHtml(h){ const d=document.createElement('div'); d.innerHTML=h||''; return (d.textContent||'').trim(); }
function extractMediaRel(h){
  // 把题目的 media:// 图片提取成相对 /api/media/... 路径(供学生端 API+ 拼接)
  const out=[];
  const re=/media:\/\/([^"'\s>]+)/g; let m;
  while((m=re.exec(h||''))){ out.push('/api/media/'+m[1]); }
  return out;
}
// 把一道题库题加入待发列表（1=新增, 0=已存在, -1=数据缺失）
function _pushToBatch(id){
  const q = qbCache[id]; if(!q) return -1;
  if(batchErrs.some(b=>b.srcId===id)) return 0;
  const kpId = q.kpId||'';
  batchErrs.push({
    srcId: id,
    stem: stripHtml(q.content||''),
    analysis: stripHtml(q.answer||''),
    kpId: kpId,
    kpName: (kpId && KP_MAP[kpId]) || '',
    pickedI: extractMediaRel(q.content||'').slice(),
    pickedA: extractMediaRel(q.answer||'').slice(),
    pendS: [], pendA: [], files: []
  });
  return 1;
}
// 题库里「加入待发列表」（单题）：不用填表单、也不用翻到最上边

let batchErrs = [];
function clearForm(){
  document.getElementById('e-stem').value='';
  document.getElementById('e-analysis').value='';

// 知识点下拉：录入错题时可归档到指定知识点（决定题库树里的位置）；不选则不入任何知识点
let KP_MAP = {};
async function loadKpOptions(){
  const sel = document.getElementById('e-kp'); if(!sel) return;
  const {j} = await call('/api/knowledgePoints?limit=2000');
  const items = (Array.isArray(j)?j:[]).map(x=>x.body||x).filter(x=>x&&x.id);
  KP_MAP = {};
  items.forEach(x=>{ KP_MAP[x.id] = x.name || x.id; });
  const byParent = {};
  items.forEach(x=>{ const p = x.parentId||''; (byParent[p]=byParent[p]||[]).push(x); });
  const opts = []; const seen = {};
  (function walk(pid, depth){
    (byParent[pid]||[]).forEach(x=>{
      if(seen[x.id] || depth>8) return;
      seen[x.id] = 1;
      opts.push(`<option value="${x.id}">${'　'.repeat(depth)}${x.name||x.id}</option>`);
      walk(x.id, depth+1);
    });
  })('',0);
  const cur = sel.value;
  sel.innerHTML = '<option value="">不归档知识点</option>' + opts.join('');
  if(cur && KP_MAP[cur]) sel.value = cur;
}
// 一道待发错题的内容指纹：题面文字 + 答案文字 + 题库带入图片路径 + 粘贴/选择图片(名/大小/修改时间)
function batchSig(o){
  const picked = a => (a||[]).join('|');
  const pasted = a => (a||[]).map(it=>{
    const f = (it && it.file) || {};
    return `${f.name||''}:${f.size||0}:${f.lastModified||0}`;
  }).join('|');
  return [o.stem||'', o.analysis||'', picked(o.pickedI), picked(o.pickedA),
          pasted(o.pendS), pasted(o.pendA)].join('#');
}
function addBatch(){
  const msg = document.getElementById('e-msg'); msg.textContent='';
  const stem = qs('#e-stem'), analysis = qs('#e-analysis');
  const files = [...document.getElementById('e-files').files];
  if(!stem && !pickedImgs.length && !pendingImgs.stem.length){
    msg.textContent='请先填写题面文字或添加题目图片'; msg.className='err'; return;
  }
  // 防重复：仅当题面文字、答案文字、图片（题库带入路径 + 粘贴图片文件名/大小/时间）全都一致时才算同一题，
  // 避免“两道不同题都只有一张题图”被误判成重复。
  const cur = { stem, analysis,
    pickedI: pickedImgs, pickedA: pickedAnsImgs,
    pendS: pendingImgs.stem, pendA: pendingImgs.answer };
  const sig = batchSig(cur);
  const dupIdx = batchErrs.findIndex(b=>batchSig(b)===sig);
  if(dupIdx >= 0 && !confirm('这和第 '+(dupIdx+1)+' 题内容完全一致（题面/答案/图片都相同），确定要再加一份吗？\n（取消=返回检查，避免重复发给同一学生）')) return;
  const kpSel = document.getElementById('e-kp');
  batchErrs.push({
    stem, analysis,
    kpId: kpSel ? kpSel.value : '',
    kpName: kpSel && kpSel.value ? (KP_MAP[kpSel.value] || '') : '',
    pickedI: pickedImgs.slice(), pickedA: pickedAnsImgs.slice(),
    pendS: pendingImgs.stem, pendA: pendingImgs.answer, files
  });
  clearForm();
  renderBatch();
  msg.textContent='已加入待发列表（第 '+batchErrs.length+' 题），可继续录入下一题'; msg.className='ok';
}
function renderBatch(){
  const box = document.getElementById('batch-box'); box.innerHTML='';

      <button type="button" class="danger sm" onclick="delBatch(${i})"><svg class="ic"><use href="#i-trash"/></svg>移除</button>
    </div>`);

async function saveBatch(){

  if(!batchErrs.length){ msg.textContent='请先录入错题并点「加入待发列表」'; msg.className='err'; return; }
  const ids = [...document.querySelectorAll('#e-student-box input:checked')].map(c=>c.value);
  if(!ids.length){ msg.textContent='请先在上方选择要发送的学生'; msg.className='err'; return; }
  let ok = 0;
  for(const b of batchErrs){
    const images = b.pickedI.slice();
    for(const it of b.pendS){
      const fj = await uploadMedia(it.file, 'trainErrors');
      if(!fj.ok){ msg.textContent='题面图片上传失败：'+(fj.error||''); msg.className='err'; return; }
      images.push(fj.url.replace(API,''));
    }
    const answerImages = b.pickedA.slice();
    for(const it of b.pendA){
      const fj = await uploadMedia(it.file, 'trainErrors');
      if(!fj.ok){ msg.textContent='答案图片上传失败：'+(fj.error||''); msg.className='err'; return; }
      answerImages.push(fj.url.replace(API,''));
    }
    const files = [];
    for(const f of b.files){
      const fj = await uploadMedia(f, 'trainErrors');
      if(!fj.ok){ msg.textContent='附件上传失败：'+(fj.error||''); msg.className='err'; return; }
      files.push({name:f.name, url:fj.url.replace(API,'')});
    }
    const body = { studentIds: ids, stem: b.stem, analysis: b.analysis,
      kpId: b.kpId||'', knowledgePoint: b.kpName||'',
      images, answerImages, files, image: images[0]||'' };
    const {status,j} = await call('/api/train/errors',{method:'POST',json:body});
    if(status!==200){ msg.textContent=(j&&j.error)||'保存失败'; msg.className='err'; return; }

async function loadStuMgmt(){
  const [{j:stus},{j:acc},{j:errs}] = await Promise.all([
    call('/api/train/students'),
    call('/api/train/student/accounts'),
    call('/api/train/errors')
  ]);
  const accMap = {}, accPw = {};
  (acc?acc.items:[]).forEach(a=>{ accMap[a.studentId]=a.username; if(a.password) accPw[a.studentId]=a.password; });

  const errCount = {};

function _ab2b64(buf){
  const bytes = new Uint8Array(buf); let bin = ''; const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(bin);
}
// 下载 Word：老师端可导某学生「某天任务的题」或「全部错题本」。
// 在电脑端工作台里（内嵌 iframe）浏览器不支持 blob 下载 → 交给本机保存并用 Word 打开。
async function downloadDocx(url, fallbackName){
  try{
    const r = await fetch(API+url, {headers: TOKEN?{'Authorization':'Bearer '+TOKEN}:{}});
    if(!r.ok){ let m='下载失败'; try{ const j=await r.json(); m=j.error||m; }catch(e){} toastMsg(m); return; }
    let fname = fallbackName || '错题.docx';
    const cd = r.headers.get('Content-Disposition') || '';
    const mm = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if(mm){ try{ fname = decodeURIComponent(mm[1]); }catch(e){} }
    const buf = await r.arrayBuffer();
    const embedded = (window.self !== window.top);
    if(embedded){
      window.parent.postMessage({type:'xls-save-file', name:fname, b64:_ab2b64(buf)}, '*');
      toastMsg('已交给电脑端保存：'+fname);
      return;
    }
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toastMsg('已开始下载：'+fname);
  }catch(e){ toastMsg('下载失败，请重试'); }
}

// 数字滚动：从 0 增长到目标值（支持百分号等后缀）
function countUp(el, target, dur){
  if(!el) return;
  const txt = String(target);
  const m = txt.match(/^(\d+)(.*)$/);
  if(!m || parseInt(m[1],10)===0){ return; }
  const num = parseInt(m[1],10), tail = m[2]||'', D = dur||640, t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t-t0)/D);
    const e = 1 - Math.pow(1-p, 3);           // easeOutCubic
    el.textContent = Math.round(num*e) + tail;
    if(p<1) requestAnimationFrame(step);
    else el.textContent = txt;
  }
  el.textContent = '0' + tail;
  requestAnimationFrame(step);
  // 兜底：若 rAF 被节流（后台标签页等），动画结束后也要落到终值
  setTimeout(()=>{ if(el.textContent !== txt) el.textContent = txt; }, D + 120);
}
function animateNums(root){
  root = typeof root==='string' ? document.getElementById(root) : root;
  if(!root) return;
  [...root.querySelectorAll('b')].forEach((b,i)=>{
    const t = b.textContent.trim();
    if(!/^\d/.test(t)) return;
    b.textContent = t;
    setTimeout(()=>countUp(b, t), 40 + i*75);
  });
}

  }
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.body.classList.contains('focus-mode')) toggleFocus(false);
    const sp = document.getElementById('stu-drop');
    if(sp && !sp.classList.contains('hidden')) toggleStuDrop();
  }
});

autoLogin();
</script>
