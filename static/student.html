<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>每日一题 · 学生端</title>
<style>
  :root{
    --primary:#4361ee; --primary-d:#3a56d4; --bg:#f5f6fa; --card:#fff;
    --border:#e6e8ef; --text:#1f2430; --muted:#8a90a2; --danger:#e5484d;
    --success:#2e9e5b; --info:#2274c9; --gray:#9aa0b4; --info-bg:#eef4ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
  .hidden{display:none!important}
  .content{padding:12px 12px 28px;max-width:720px;margin:0 auto}
  .topbar{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .topbar .t-title{font-weight:700;font-size:16px}
  .topbar .t-usr{font-size:12px;opacity:.92;margin-right:8px}
  .btn{border:none;border-radius:10px;padding:10px 12px;background:var(--primary);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.ok{background:var(--primary)}
  .btn.sec{background:#eef0f6;color:var(--text)}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn.block{width:100%}
  .row{display:flex;align-items:center;gap:8px}
  .col{display:flex;flex-direction:column;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  .center{text-align:center;color:var(--muted);padding:28px 16px;line-height:1.7}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
  .subtabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;position:sticky;top:48px;
    background:var(--bg);z-index:4}
  .subtab{border:1px solid var(--border);background:#fff;border-radius:999px;
    padding:7px 16px;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer}
  .subtab.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .q-content{font-size:16px;margin:6px 0;word-break:break-word}
  .qimg{max-width:100%;border-radius:8px;margin:6px 0;display:block}
  .q-ans-box{margin:8px 0 0;display:none;border-left:3px solid var(--info);
    background:var(--info-bg);border-radius:8px;padding:8px 12px}
  .q-ans-box.open{display:block}
  .ans-label{font-size:12px;font-weight:700;color:var(--info);margin-bottom:2px}
  .badge-info{background:#e7f0ff;color:var(--info);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  .badge-success{background:#e6f6ec;color:var(--success);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  .badge-danger{background:#fde8e9;color:var(--danger);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  .badge-gray{background:#eef0f6;color:var(--gray);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
  textarea{resize:vertical}
  label.kv{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  /* 登录页 */
  #loginView{min-height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:24px;max-width:420px;margin:0 auto}
  .logo{font-size:22px;font-weight:800;text-align:center;color:var(--primary);margin-bottom:4px}
  .sub{text-align:center;color:var(--muted);margin-bottom:22px}
  .login-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(20,30,60,.06)}
  .auth-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px}
  #toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,24,35,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:86%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="邢老师·学生端">
<meta name="theme-color" content="#1a7d4f">
<link rel="manifest" href="/student.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-student-180.png">
</head>
<body>

  <!-- 登录 -->
  <div id="loginView">
    <div class="logo">每日一题</div>
    <div class="sub">邢老师的学生专属答题端</div>
    <div class="login-box">
      <label class="kv">后端地址</label>
      <input id="baseUrl" type="text" placeholder="https://...">
      <label class="kv">账号</label>
      <input id="username" type="text" placeholder="学生账号">
      <label class="kv">密码</label>
      <input id="password" type="password" placeholder="密码">
      <button class="btn block ok" style="margin-top:16px" onclick="doLogin()">登录</button>
      <div class="auth-hint" id="loginMsg">用老师给的账号登录即可答题</div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView" class="hidden">
    <div class="topbar">
      <span class="t-title">每日一题</span>
      <span><span class="t-usr" id="stuName"></span><a onclick="logout()" style="color:#fff;font-size:13px;cursor:pointer;text-decoration:underline">退出</a></span>
    </div>
    <div class="content">
      <div class="subtabs" id="dailySubTabs"></div>
      <div id="sub-practice"></div>
      <div id="sub-wrong" class="hidden"></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/static/student.js"></script>
</body>
</html>
