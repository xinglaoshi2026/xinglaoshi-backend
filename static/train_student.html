<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>错题循环训练 · 学生端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#1f2430;font-size:16px}
  .c{max-width:640px;margin:0 auto;padding:12px 12px 30px}
  .bar{background:#4361ee;color:#fff;padding:14px;border-radius:12px;margin-bottom:12px;text-align:center;font-size:18px;font-weight:600}
  .card{background:#fff;border:1px solid #e6e8ef;border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;margin:6px 0 4px;color:#5a6072;font-size:13px}
  select,input,textarea{width:100%;padding:10px;border:1px solid #d7dae6;border-radius:8px;font-size:15px}
  button{background:#4361ee;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-size:16px;width:100%;margin-top:10px;cursor:pointer}
  button.ghost{background:#eef4ff;color:#3a56d4}
  button.sm{width:auto;padding:8px 12px;font-size:14px;margin:4px 4px 0 0}
  .q,.wq{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eee}
  .filetag{display:inline-block;background:#eef4ff;color:#3a56d4;border-radius:6px;padding:4px 8px;font-size:13px;margin:4px 6px 0 0;text-decoration:none}
  .rv{background:#f8f9ff;border:1px solid #dfe3f5;border-radius:10px;padding:10px;margin-top:8px}
  .pv,.tbs{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
  .tw{position:relative;display:inline-block;margin:4px 4px 0 0}
  .tw img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #e3e6f0;display:block}
  .tw .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e5484d;color:#fff;border:0;font-size:12px;line-height:20px;padding:0;margin:0;cursor:pointer}
  .done-tag{color:#2e9e5b;font-size:14px;margin-top:6px}
  .qi{color:#8a90a2;font-size:12px;margin-bottom:4px}
  img.qi{width:100%;border-radius:8px;margin-top:6px}
  .ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ans button{width:auto;margin:0;padding:8px 14px;font-size:14px}
  .right{background:#e7f7ee;color:#2e9e5b}
  .wrong{background:#fdecec;color:#e5484d}
  .self{background:#fff3e0;color:#c77700}
  .hidden{display:none!important}
  .score{text-align:center;font-size:20px;margin:8px 0}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .topbar .nm{font-size:14px;color:#5a6072}
  .topbar button{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#eef4ff;color:#3a56d4}
  .err{color:#e5484d;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="c">
  <div class="bar">我的错题练习</div>

  <div id="login" class="card">
    <label>账号</label>
    <input id="username" placeholder="老师给你的账号">
    <label>密码</label>
    <input id="password" type="password" placeholder="密码">
    <button onclick="doLogin()">登录</button>
    <div id="lmsg" class="err"></div>
  </div>

  <div id="main" class="hidden">
    <div class="topbar">
      <span class="nm" id="me"></span>
      <button onclick="logout()">退出</button>
    </div>
    <div class="card" id="head"></div>
    <div class="card" id="sharedCard">
      <label style="font-weight:bold">第1步 · 拍照上传计算过程（多题写在同一张纸上，只需传一次）</label>
      <div class="pv" id="shared-pv"></div>
      <input id="shared-ph" type="file" accept="image/*" multiple onchange="addSharedPhotos(this)">
      <div style="font-size:12px;color:#8a90a2;margin-top:4px">如果某道题另有单独的过程图，可在该题下方再补传（不传也可以）。</div>
    </div>
    <div id="items"></div>
    <button id="submitBtn" onclick="submit()">提交今日练习</button>
    <div id="result"></div>
    <div class="card" id="weekCard" style="margin-top:14px">
      <div class="topbar">
        <b>最近一周错题</b>
        <button onclick="toggleWeek()" id="weekBtn">展开</button>
      </div>
      <div id="weekList" class="hidden"></div>
      <div id="weekLock" class="hidden" style="color:#c77700;font-size:13px;padding:8px 2px;line-height:1.5">🔒 完成今日作业后，这里才能查看（防止提前看到答案、重复做题时作弊）。</div>
      <div id="dlBox" class="hidden" style="margin-top:10px">
        <button class="ghost" onclick="downloadErrors()">⬇️ 下载我的错题本（Word）</button>
        <div style="font-size:12px;color:#8a90a2;margin-top:4px">把全部错题（含答案）导成 Word 文档，可打印出来在纸上练。</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = location.origin;
let TOKEN = localStorage.getItem('tt_token') || '';
let ME = '';

async function call(p, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(API+p, opts);
  let j=null; try{j=await r.json()}catch(e){}
  return {status:r.status, j};
}

function show(ok){
  document.getElementById('login').classList.toggle('hidden', ok);
  document.getElementById('main').classList.toggle('hidden', !ok);
}

async function doLogin(){
  const u=document.getElementById('username').value.trim();
  const pw=document.getElementById('password').value;
  document.getElementById('lmsg').textContent='';
  if(!u||!pw){ document.getElementById('lmsg').textContent='请输入账号和密码'; return; }
  const {status,j}=await call('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:pw})});
  if(status!==200||!j||!j.token){ document.getElementById('lmsg').textContent=(j&&j.error)||'登录失败'; return; }
  TOKEN=j.token; ME=(j.user&&j.user.username)||u;
  localStorage.setItem('tt_token', TOKEN);
  show(true);
  document.getElementById('me').textContent='你好，'+ME;
  await loadToday();
  updateWeekLock();
}

function logout(){
  TOKEN=''; localStorage.removeItem('tt_token');
  document.getElementById('items').innerHTML='';
  document.getElementById('result').innerHTML='';
  document.getElementById('weekList').innerHTML='';
  document.getElementById('weekList').classList.add('hidden');
  document.getElementById('weekBtn').textContent='展开';
  WEEK_LOADED=false;
  SHARED={photos:[],urls:[]};
  show(false);
}

async function loadToday(){
  const {status,j}=await call('/api/train/today');
  if(status===401){ logout(); return; }
  const task=j.task;
  const head=document.getElementById('head');
  if(!task){ head.innerHTML='<b>今天还没有给你的练习包</b><br><span style="color:#8a90a2">让老师先点"生成今日任务"哦</span>'; document.getElementById('submitBtn').classList.add('hidden'); document.getElementById('sharedCard').classList.add('hidden'); return; }
  document.getElementById('submitBtn').classList.remove('hidden');
  head.innerHTML='<b>'+task.date+' 练习</b> · 共'+j.items.length+'题'+(task.status==='done'||task.status==='partial'?' · 已完成 ✓':' · 待完成');
  TASK_DONE = !task || task.status==='done';   // 无作业 或 已提交完成 → 解锁近期错题
  if(!j.items.length){
    head.innerHTML='<b>'+task.date+'</b> · 今天没有需要练的错题，休息一下';
    document.getElementById('submitBtn').classList.add('hidden');
    document.getElementById('sharedCard').classList.add('hidden');
    TASK_DONE=true; updateWeekLock(); return;
  }
  SHARED={photos:[],urls:[]}; renderShared();
  const box=document.getElementById('items'); box.innerHTML=''; ST={};
  j.items.forEach((e,idx)=>{
    const imgs = (e.images&&e.images.length)?e.images:(e.image?[e.image]:[]);
    const imgHtml = imgs.map(u=>`<img class="qi" style="cursor:zoom-in" src="${API+u}" onclick="zoomImg('${API+u}')">`).join('');
    const files = (e.files&&e.files.length)? e.files.map(f=>{
      const fu = (typeof f==='string')?f:(f.url||''); const fn=(typeof f==='string')?'附件':(f.name||'附件');
      return `<a class="filetag" href="${API+fu}" target="_blank" rel="noopener">📎 ${fn}</a>`;
    }).join(' ') : '';
    box.insertAdjacentHTML('beforeend',`<div class="q" id="q_${idx}" data-idx="${idx}" data-eid="${e.id}">
      <div class="qi">第${idx+1}题 · ${e.knowledgePoint||''} <span style="color:#8a90a2">${e.errorReason||''}</span></div>
      <div>${(e.stem||(imgs.length?'':'（看图）'))}</div>${imgHtml}
      ${files?('<div style="margin-top:6px">'+files+'</div>'):''}
      <label>本题另有过程图时补充上传（可选）</label>
      <div class="pv" id="pv_${idx}"></div>
      <input id="ph_${idx}" type="file" accept="image/*" multiple onchange="addPhotos(${idx},this)">
      <button class="sm ghost" id="rvbtn_${idx}" onclick="reveal(${idx})">第2步 · 提交并看答案</button>
      <div id="rv_${idx}" class="rv hidden"></div>
      <div id="fb_${idx}"></div>
    </div>`);
  });
}
// 公共计算过程（多题写在同一张纸上时只传一次，提交时每题都会带上这些图）
let SHARED = {photos:[], urls:[]};
function addSharedPhotos(inp){
  [...inp.files].forEach(f=>SHARED.photos.push(f));
  inp.value='';
  renderShared();
}
function renderShared(){
  document.getElementById('shared-pv').innerHTML =
    SHARED.urls.map(u=>`<span class="tw"><img src="${API+u}" onclick="zoomImg('${API+u}')"><span class="x" style="opacity:.6">已传</span></span>`).join('')
    + SHARED.photos.map((f,i)=>
      `<span class="tw"><img src="${URL.createObjectURL(f)}"><button class="x" onclick="delSharedPhoto(${i})">×</button></span>`).join('');
}
function delSharedPhoto(i){
  if(SHARED.urls.length){ alert('已提交的过程照片不能删除'); return; }
  SHARED.photos.splice(i,1); renderShared();
}
async function uploadShared(){
  for(const f of SHARED.photos){
    const uniq = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    try{
      const fr = await fetch(API+'/api/train/media?sub=drafts&name='+encodeURIComponent(uniq+'_'+(f.name||'photo.jpg')),
        {method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:f});
      const fj = await fr.json();
      if(fj.ok) SHARED.urls.push(fj.url.replace(API,''));
    }catch(e){}
  }
  SHARED.photos = [];
  renderShared();
}
// 每题状态: photos[File] urls[已上传] result note
let ST={};
function addPhotos(idx,inp){
  ST[idx]=ST[idx]||{photos:[],urls:[],result:'',note:''};
  [...inp.files].forEach(f=>ST[idx].photos.push(f));
  inp.value='';
  renderPhotos(idx);
}
function renderPhotos(idx){
  const st=ST[idx]||{photos:[]};
  document.getElementById('pv_'+idx).innerHTML = st.photos.map((f,i)=>
    `<span class="tw"><img src="${URL.createObjectURL(f)}"><button class="x" onclick="delPhoto(${idx},${i})">×</button></span>`).join('');
}
function delPhoto(idx,i){
  if(ST[idx].urls.length){ alert('已提交过程照片，不能删除'); return; }
  ST[idx].photos.splice(i,1); renderPhotos(idx);
}

// 第2步: 上传过程照片 → 拉取答案/解析 → 显示自评+错误原因
async function reveal(idx){
  const st=ST[idx]=ST[idx]||{photos:[],urls:[],result:'',note:''};
  if(!st.photos.length && !st.urls.length && !SHARED.photos.length && !SHARED.urls.length){
    alert('请先在上方拍照上传计算过程（多题写在同一张纸上，传一次即可），再提交看答案'); return;
  }
  const eid=document.getElementById('q_'+idx).dataset.eid;
  const btn=document.getElementById('rvbtn_'+idx);
  btn.disabled=true; btn.textContent='上传中…';
  try{
    await uploadShared();
    for(const f of st.photos){
      // 文件名加唯一前缀，避免多学生/多次上传同名文件互相覆盖
      const uniq = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const fr=await fetch(API+'/api/train/media?sub=drafts&name='+encodeURIComponent(uniq+'_'+(f.name||'photo.jpg')),
        {method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:f});
      const fj=await fr.json();
      if(fj.ok) st.urls.push(fj.url.replace(API,''));
    }
  }catch(err){ btn.disabled=false; btn.textContent='第2步 · 提交并看答案'; alert('上传失败，请重试'); return; }
  const {status,j}=await call('/api/train/errors/'+eid+'/reveal');
  if(status===401){ logout(); return; }
  if(!j||j.error){ btn.disabled=false; btn.textContent='第2步 · 提交并看答案'; alert((j&&j.error)||'获取答案失败'); return; }
  btn.textContent='已提交 ✓ 答案见下';
  const ansImgs=(j.answerImages&&j.answerImages.length)?j.answerImages.map(u=>`<img class="qi" style="cursor:zoom-in" src="${API+u}" onclick="zoomImg('${API+u}')">`).join(''):'';
  document.getElementById('rv_'+idx).innerHTML=`
    ${j.answer?('<div><b>答案：</b>'+j.answer+'</div>'):''}
    <div style="color:#5a6072;margin-top:4px"><b>解析：</b>${j.analysis||'(无文字解析)'}</div>
    ${ansImgs?('<div class="tbs" style="display:block">'+ansImgs+'</div>'):''}
    <label style="margin-top:8px">第3步 · 自评</label>
    <div class="ans">
      <button class="sm right" onclick="setSelf(${idx},'self_right')">做对了</button>
      <button class="sm self" onclick="setSelf(${idx},'half')">半对</button>
      <button class="sm wrong" onclick="setSelf(${idx},'self_wrong')">做错了</button>
    </div>
    <label>第4步 · 错误原因（必填，不填无法提交）</label>
    <textarea class="note" id="note_${idx}" placeholder="如：公式记错了 / 计算粗心 / 题目没读懂…" oninput="setNote(${idx},this.value)"></textarea>`;
  document.getElementById('rv_'+idx).classList.remove('hidden');
}
function setSelf(idx,val){
  ST[idx].result=val;
  setFb(idx);
}
function setNote(idx,v){ ST[idx].note=v; setFb(idx); }
function setFb(idx){
  const st=ST[idx]; const el=document.getElementById('fb_'+idx);
  if(!el) return;
  if(st.result && (st.note||'').trim()){
    el.innerHTML='<div class="done-tag">✓ 本题已记录（'+(st.result==='self_right'?'做对了':st.result==='half'?'半对':'做错了')+'）</div>';
  }else if(st.result){
    el.innerHTML='<div style="color:#c77700;font-size:13px;margin-top:4px">已选自评，还需填写错误原因</div>';
  }else{
    el.innerHTML='';
  }
}

// 点击放大图片
function zoomImg(url){
  let m=document.getElementById('zoom-mask');
  if(!m){ m=document.createElement('div'); m.id='zoom-mask';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out';
    m.onclick=function(){ m.style.display='none'; };
    document.body.appendChild(m); }
  m.innerHTML='<img src="'+url+'" style="max-width:94%;max-height:88%;border-radius:10px">';
  m.style.display='flex';
}

async function submit(){
  const qs=[...document.querySelectorAll('#items .q')];
  if(!qs.length) return;
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent='上传中…';
  try{ await uploadShared(); }
  catch(e){ btn.disabled=false; btn.textContent='提交今日练习'; alert('过程图上传失败，请重试'); return; }
  const shared = SHARED.urls.slice();   // 一张纸写多题：这些图每题都会带上
  const answers=[];
  for(let i=0;i<qs.length;i++){
    const q=qs[i], n=i+1;
    const idx=q.dataset.idx, eid=q.dataset.eid;
    const st=ST[idx]||{photos:[],urls:[],result:'',note:''};
    const imgs = shared.concat(st.urls||[]);
    if(!imgs.length){ alert('第'+n+'题还没上传计算过程，请先完成第1、2步'); btn.disabled=false; btn.textContent='提交今日练习'; return; }
    if(!st.result){ alert('第'+n+'题还没自评对错，请完成第3步'); btn.disabled=false; btn.textContent='提交今日练习'; return; }
    if(!(st.note||'').trim()){ alert('第'+n+'题还没写错误原因，请完成第4步'); btn.disabled=false; btn.textContent='提交今日练习'; return; }
    answers.push({errorId:eid, result:st.result,
                  draftImage:imgs[0]||'', draftImages:imgs,
                  errorNote:st.note.trim()});
  }
  btn.textContent='提交中…';
  const {status,j}=await call('/api/train/submit',{method:'POST',body:JSON.stringify({answers})});
  btn.disabled=false; btn.textContent='提交今日练习';
  if(status===401){ logout(); return; }
  if(!j||!j.ok){ document.getElementById('result').textContent=(j&&j.error)||'提交失败'; return; }
  let h='<div class="score">本次自评：'+j.right+'/'+j.total+' 题做对</div>';
  (j.results||[]).forEach((r,i)=>{
    const ok=r.result==='right'||r.result==='self_right';
    const ansImgs=(r.answerImages&&r.answerImages.length)?r.answerImages.map(u=>`<img class="qi" style="cursor:zoom-in" src="${API+u}" onclick="zoomImg('${API+u}')">`).join(''):'';
    h+=`<div class="card"><div class="qi">第${i+1}题 · <b>${ok?'✓ 对':'✗ 错'}</b></div>
      <div style="color:#5a6072">解析：${r.analysis||'(无)'}</div>${ansImgs?('<div style="margin-top:4px">'+ansImgs+'</div>'):''}</div>`;
  });
  h+='<p style="color:#8a90a2;font-size:13px">做错的题过几天会再来找你，加油！</p>';
  document.getElementById('result').innerHTML=h;
  document.getElementById('submitBtn').classList.add('hidden');
  // 当日作业已提交完成 → 解锁近期错题，并自动展开供复习
  TASK_DONE = true;
  updateWeekLock();
  document.getElementById('weekList').classList.remove('hidden');
  document.getElementById('weekBtn').textContent='收起';
  if(!WEEK_LOADED) loadWeek();
}

// ---------- 最近一周错题 ----------
let WEEK_LOADED = false;
let TASK_DONE = false;   // 当日作业是否已提交完成（提交后才解锁近期错题）
function updateWeekLock(){
  const lock = document.getElementById('weekLock');
  const btn = document.getElementById('weekBtn');
  const dl = document.getElementById('dlBox');
  if(TASK_DONE){
    lock.classList.add('hidden');
    btn.classList.remove('hidden'); btn.disabled = false;
    dl.classList.remove('hidden');
  }else{
    document.getElementById('weekList').classList.add('hidden');
    btn.classList.add('hidden');
    dl.classList.add('hidden');
    lock.classList.remove('hidden');
  }
}
// 下载错题本（Word）：与「组卷下载」同一套排版，后端导出全部错题（含答案）
async function downloadErrors(){
  try{
    const r = await fetch(API+'/api/train/errors/export.docx', {headers: TOKEN?{'Authorization':'Bearer '+TOKEN}:{}});
    if(!r.ok){
      let m = '下载失败';
      try{ const j = await r.json(); m = j.error || m; }catch(e){}
      alert(m); return;
    }
    const blob = await r.blob();
    let fname = '错题本.docx';
    const cd = r.headers.get('Content-Disposition') || '';
    const mm = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if(mm){ try{ fname = decodeURIComponent(mm[1]); }catch(e){} }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){ alert('下载失败，请重试'); }
}
function toggleWeek(){
  if(!TASK_DONE){ return; }   // 当日作业未提交完成，锁定
  const box = document.getElementById('weekList');
  const btn = document.getElementById('weekBtn');
  const hidden = box.classList.toggle('hidden');
  btn.textContent = hidden ? '展开' : '收起';
  if(!hidden && !WEEK_LOADED) loadWeek();
}
async function loadWeek(){
  const {status,j} = await call('/api/train/errors');
  if(status===401){ logout(); return; }
  WEEK_LOADED = true;
  const items = (j&&j.items)||[];
  const cutoff = Date.now() - 7*24*3600*1000;
  const recent = items.filter(e=>{
    if(e.createdAt) return e.createdAt >= cutoff;
    if(e.wrongDate) return new Date(e.wrongDate.replace(/-/g,'/')).getTime() >= cutoff;
    return false;
  }).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const box = document.getElementById('weekList');
  if(!recent.length){ box.innerHTML = '<div style="color:#8a90a2;font-size:14px;padding:6px 0">最近一周还没有错题记录</div>'; return; }
  box.innerHTML = recent.map((e,i)=>{
    const imgs = ((e.images&&e.images.length)?e.images:(e.image?[e.image]:[])).map(u=>`<img class="qi" style="cursor:zoom-in" src="${API+u}" onclick="zoomImg('${API+u}')">`).join('');
    const ansImgs = (e.answerImages&&e.answerImages.length)?e.answerImages.map(u=>`<img class="qi" style="cursor:zoom-in" src="${API+u}" onclick="zoomImg('${API+u}')">`).join(''):'';
    const files = (e.files&&e.files.length)? e.files.map(f=>{
      const fu=(typeof f==='string')?f:(f.url||''); const fn=(typeof f==='string')?'附件':(f.name||'附件');
      return `<a class="filetag" href="${API+fu}" target="_blank" rel="noopener">📎 ${fn}</a>`;
    }).join(' ') : '';
    return `<div class="wq">
      <div class="qi">${i+1} · ${e.wrongDate||''} ${e.knowledgePoint?('<span style="color:#8a90a2">'+e.knowledgePoint+'</span>'):''}</div>
      <div>${(e.stem||'')}${(!e.stem&&!imgs.length)?'（看图）':''}</div>${imgs}
      ${files?('<div style="margin-top:6px">'+files+'</div>'):''}
      <button class="sm ghost" onclick="const d=document.getElementById('wans_${i}'); d.classList.toggle('hidden'); this.textContent=d.classList.contains('hidden')?'看解析':'收起解析'">看解析</button>
      <div id="wans_${i}" class="hidden"><div style="color:#5a6072;margin-top:4px">${e.analysis||'(无文字解析)'}</div>${ansImgs?('<div>'+ansImgs+'</div>'):''}</div>
    </div>`;
  }).join('');
}

// 启动时若有 token 尝试直接进入(后端会校验有效性)
if(TOKEN){
  show(true);
  call('/api/train/students').then(({status,j})=>{
    if(status===401){ logout(); return; }
    const me = (j && j.items && j.items[0]) || null;
    document.getElementById('me').textContent = me ? ('你好，'+(me.name||me.username||'')) : '已登录';
    loadToday().then(updateWeekLock);
  });
}
</script>
