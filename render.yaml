# 渲染 一键部署配置（免费层）
# 部署后获得一个公网 URL，手机端填该 URL 即可在任何网络下同步。
服务:
  - 类型: web
    名称: xing-laoshi-sync
    运行时: python
    计划: 免费
    区域: 俄勒冈州        # 可选：新加坡等
构建命令: "pip install -r requirements.txt"
    启动命令: "python server.py"
    健康检查路径: "/"
    环境变量:
      - 键: PORT
        值: "10000"
      - 键: DATA_DIR
        值: "/var/data/sync"
    # 持久化磁盘（免费层默认容器磁盘重启会清空，挂载 Disk 以保留数据）
    磁盘:
      名称: syncdatadisk
      挂载路径: /var/data
      大小（GB）: 1
